# The local Postgres allows 20 connections (17 for non-superusers), and every
# cached Spring test context keeps its own pool open - several with the
# default ten. Holding one context at a time keeps a full run under that;
# a context is rebuilt when a later class needs it again. CI's Postgres
# allows 100 and would not need this, but the same run should pass on both.
spring.test.context.cache.maxSize=1
