server:
  # Render (and platforms like it) inject PORT at runtime - default here is
  # only for running the jar directly with no PORT set.
  port: ${PORT:8080}

spring:
  application:
    name: sheout-backend

  # Spring Security is here for response headers only (SecurityHeadersConfig).
  # Without this exclusion Boot would also create an in-memory user with a
  # generated password and print it to the log - a credential for nothing,
  # in a place logs get pasted.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # No default here on purpose: this is the Render/production profile, and
  # a missing DATABASE_URL should fail startup loudly rather than silently
  # trying to reach a localhost Postgres that doesn't exist in that
  # environment. Format is a standard JDBC url with credentials as query
  # params, e.g. from Neon:
  #   jdbc:postgresql://<host>/<dbname>?user=<user>&password=<pass>&sslmode=require
  # Local dev overrides this - see application-local.yml.
  datasource:
    url: ${DATABASE_URL}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Mail is off until spring.mail.host is set (see sheout.notifications.email).
  # This is the one setting every real provider needs and none of them supply
  # by default: STARTTLS on submission port 587, which Gmail and SendGrid both
  # require before they will accept a login. It is offered, not demanded - a
  # server that does not advertise STARTTLS is still talked to in the clear,
  # which is what a local test SMTP server is. Credentials are sent only when
  # SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD are both set.
  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: true

  data:
    redis:
      # Same reasoning as datasource.url - required, no default. Paste
      # Upstash's connection string as-is, e.g.:
      #   rediss://default:<password>@<host>:<port>
      # Local dev overrides this - see application-local.yml.
      url: ${REDIS_URL}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Placeholders for services not implemented yet. Every value is sourced
# from an env var with no default secret - set real values via a local
# .env (see .env.example) or the deploy environment's secret store. Never
# put a real value directly in this file.
sheout:
  cors:
    # Comma-separated origins allowed to call the API from a browser (see
    # WebConfig) - defaults cover the frontend apps' local dev ports.
    # Add the deployed frontend's real origin here once one exists.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

  rate-limit:
    # Which request header carries the real client address, for per-client
    # limits (see ClientAddressResolver). Blank means the socket address,
    # which is right locally and WRONG behind a proxy: on Render it is the
    # proxy, shared by every user, so a per-client limit becomes a global one.
    # render.yaml sets CF-Connecting-IP.
    client-ip-header: ${CLIENT_IP_HEADER:}
    # Per phone number, within otp-window-minutes. Requesting a code is also
    # held to sheout.auth.otp-cooldown-seconds and otp-hourly-limit below.
    otp-request-per-phone: ${OTP_REQUEST_PER_PHONE:5}
    otp-verify-per-phone: ${OTP_VERIFY_PER_PHONE:5}
    otp-window-minutes: ${OTP_WINDOW_MINUTES:15}
    # Per client address, per sign-in endpoint, within otp-window-minutes.
    # Looser than per-phone on purpose: many people can share one address.
    login-per-client: ${LOGIN_PER_CLIENT:30}
    # Per partner, across all her trips, per 15 minutes. The per-trip
    # lockout (five wrong codes) still applies underneath.
    pickup-code-per-driver: ${PICKUP_CODE_PER_DRIVER:10}
    # SOS is NEVER refused. These only space out re-texting contacts: the
    # first sos-burst presses in the window all text everyone, then at most
    # one text round a minute. See SosFanOutThrottle before changing.
    sos-burst: ${SOS_BURST:5}
    sos-burst-window-minutes: ${SOS_BURST_WINDOW_MINUTES:10}

  booking:
    service-area:
      # Where SheOut operates. Both pickup and drop must fall within
      # radius-km of this centre, checked server-side on booking AND on
      # fare quotes - see ServiceArea.
      #
      # These are env-var driven on purpose: launching a second city, or
      # widening the radius as coverage grows, should be a config change
      # and a restart, not a code change. Radius is straight-line
      # kilometres from the centre, not driving distance.
      centre-lat: ${SERVICE_CENTRE_LAT:17.3850}
      centre-lng: ${SERVICE_CENTRE_LNG:78.4867}
      radius-km: ${SERVICE_RADIUS_KM:150}
      # Used in the refusal message a customer reads, so it should be the
      # city's name as a person would say it.
      centre-name: ${SERVICE_CENTRE_NAME:Hyderabad}

  support:
    # The number a rider or partner is offered instead of each other's.
    #
    # Direct customer-to-driver calling does not exist in this product, on
    # purpose: handing a stranger a woman's real phone number is exactly the
    # risk this platform exists to remove, and once it is disclosed it cannot
    # be taken back. Everything routine goes through booking-scoped chat; a
    # real person on this number handles what chat cannot.
    #
    # Served to both apps from ChatController rather than baked into either
    # of them. It used to be hardcoded, differently, in each app, so support
    # answered on one number from one app and another from the other, and
    # changing it meant a frontend deploy.
    #
    # Blank by default. Both apps hide the Contact Support action when it is
    # unset rather than showing a button that dials nothing.
    phone-number: ${SUPPORT_PHONE_NUMBER:}

    # The Grievance Officer's email - where a data-rights request or a
    # grievance goes under India's DPDP Act, and the contact the privacy
    # policy must name. Shown in both apps' Privacy & Data and Help screens.
    # Blank by default; the apps then say a grievance contact is not yet
    # available rather than showing nothing. Must be set before launch.
    grievance-officer-email: ${GRIEVANCE_OFFICER_EMAIL:}

  verification:
    # What the app tells somebody who is waiting, BEFORE there are enough
    # real reviews to measure. Said as a target ("we aim to") rather than
    # as a fact, and replaced by the measured median once five reviews
    # exist - see VerificationService.turnaroundFor. Four hours is what
    # operations can stand behind today; lower it when that changes.
    target-turnaround-minutes: ${VERIFICATION_TARGET_TURNAROUND_MINUTES:240}

  users:
    # Where the cancellation review line sits.
    #
    # A rate, not a count: a rider of three years with forty cancellations in
    # nine hundred trips is not the problem a brand-new account that cancelled
    # three out of three is, and a raw count would rank them the wrong way
    # round.
    #
    # Crossing this flags the account for a person to look at. It never
    # blocks, throttles or charges anyone - a high rate can mean somebody
    # dodging fares or somebody repeatedly abandoned by partners who never
    # arrived, and the number cannot tell those apart. Same rule driver
    # verification follows: a human decides.
    cancellation-rate-warning-threshold: ${CANCELLATION_RATE_WARNING_THRESHOLD:0.4}
    # No flag until there is enough history for the rate to mean anything.
    # Without this floor, one cancellation on a first-ever booking is a rate
    # of 100%, and every new user who changed her mind once would start her
    # second trip with an open case against her.
    cancellation-minimum-bookings: ${CANCELLATION_MINIMUM_BOOKINGS:5}

    # The other half of the same flag: an average below this is worth a
    # look. Both signals raise one flag onto one queue, because an account
    # that cancels constantly AND is rated badly is one case with two facts
    # in it, not two cases.
    rating-review-threshold: ${RATING_REVIEW_THRESHOLD:3.5}
    # The same floor, for the same reason. One furious rider on a partner's
    # first night out is an anecdote, not a pattern, and should not open a
    # case against her.
    rating-minimum-count: ${RATING_MINIMUM_COUNT:5}

  ratings:
    # How long after a trip somebody may still rate it.
    #
    # A rating is a memory, and memories go off: days later what is left is
    # rarely the ride, it is whatever has happened since. It also closes an
    # obvious lever - with no expiry, a trip from six months ago stays a
    # live threat either party can hold over the other.
    #
    # The deadline is written onto each rating slot when the trip completes,
    # so changing this affects trips completing from then on and can never
    # reopen a slot somebody was already told had closed.
    window-hours: ${RATING_WINDOW_HOURS:72}

  auth:
    # No default - see JwtService Javadoc for why a missing/weak secret
    # should fail startup rather than silently signing with something
    # guessable. Local dev gets a dev-only default - see application-local.yml.
    jwt-secret: ${JWT_SECRET}
    jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:43200}
    otp-ttl-seconds: ${OTP_TTL_SECONDS:300}
    # Whether ConsoleOtpSender writes the code itself into the log. Off by
    # default: a code in a production log is a sign-in for whoever reads it.
    # application-local.yml turns it on for development.
    log-otp-codes: ${LOG_OTP_CODES:false}
    # Numbers that always get the same code, for testing a live deploy
    # without a real SMS provider - see TestPhoneNumbers. One variable,
    # any number of entries:
    #   DEV_OTP_NUMBERS=+919000000001:123456,+919000000002:654321
    # Nothing is texted to them even once a provider is live, and they are
    # not held to the per-number request limits, because neither the bill
    # nor the stranger those limits protect exists for a number that is
    # never messaged. Unset this once real SMS works.
    dev-otp-numbers: ${DEV_OTP_NUMBERS:}
    # The three original single-number slots, still honoured so an existing
    # deployment keeps working - dev-otp-numbers is the way to add more.
    # Both blank by default - opt-in only, for demoing a live deploy without
    # a real SMS provider wired up (see ConsoleOtpSender/OtpService). When
    # set, requesting an OTP for exactly this phone number always issues
    # dev-otp-code instead of a random one, so a demo login doesn't require
    # watching Render's logs. Leave unset once a real provider exists.
    dev-otp-phone: ${DEV_OTP_PHONE:}
    dev-otp-code: ${DEV_OTP_CODE:}
    # Second slot, same idea - accounts are one-role-per-phone, so the first
    # slot's number (already used for a CUSTOMER demo login) can't also
    # demo a DRIVER login. Use this one for that.
    dev-otp-phone-2: ${DEV_OTP_PHONE_2:}
    dev-otp-code-2: ${DEV_OTP_CODE_2:}
    # Third slot, dedicated to automated QA - slots 1 and 2 are now
    # permanently consumed (each has a real account from actual use), so
    # neither can exercise the new-account signup path anymore. Set this
    # to any never-used-before number when a QA pass needs one; after
    # that run it becomes a real account too, same as the other two, so a
    # future new-account test needs a different number here.
    dev-otp-phone-3: ${DEV_OTP_PHONE_3:}
    dev-otp-code-3: ${DEV_OTP_CODE_3:}
    # Blank by default - opt-in, not fail-fast (see GoogleTokenVerifier's
    # Javadoc for why this doesn't block startup the way JWT_SECRET does).
    # No real Google Cloud OAuth Client ID exists yet for this build; set
    # GOOGLE_OAUTH_CLIENT_ID once one does.
    google-client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

  document-storage:
    # database | s3 | local - see DatabaseDocumentStorage (the default, stored in
    # Postgres), S3DocumentStorage and LocalDiskDocumentStorage.
    provider: ${DOCUMENT_STORAGE_PROVIDER:database}
    # Where signed document links point - this server as the apps reach it.
    # Render sets RENDER_EXTERNAL_URL itself; PUBLIC_BASE_URL overrides it.
    public-base-url: ${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
    local:
      path: ${DOCUMENT_STORAGE_LOCAL_PATH:./data/documents}
    s3:
      bucket: ${DOCUMENT_STORAGE_S3_BUCKET:}
      region: ${DOCUMENT_STORAGE_S3_REGION:ap-south-1}
      # Only needed for a non-AWS S3-compatible provider - leave empty for real AWS S3.
      endpoint: ${DOCUMENT_STORAGE_S3_ENDPOINT:}
      presign-expiry-minutes: ${DOCUMENT_STORAGE_S3_PRESIGN_EXPIRY_MINUTES:15}
      # Credentials are NOT a sheout.* property - S3DocumentStorage uses the
      # AWS SDK's own default credential chain, which already reads the
      # standard AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars.

  dispatch:
    # None of these were specified beyond the offer window's "e.g. 15
    # seconds" - all illustrative defaults, flagged in the dispatch module
    # README section. Tune once there's real matching data to tune against.
    initial-radius-km: ${DISPATCH_INITIAL_RADIUS_KM:3.0}
    radius-expansion-factor: ${DISPATCH_RADIUS_EXPANSION_FACTOR:2.0}
    candidate-count: ${DISPATCH_CANDIDATE_COUNT:5}
    offer-window-seconds: ${DISPATCH_OFFER_WINDOW_SECONDS:15}
    max-retries: ${DISPATCH_MAX_RETRIES:3}
    sweep-interval-ms: ${DISPATCH_SWEEP_INTERVAL_MS:2000}

    # The TOTAL time dispatch may spend hunting for a driver for one
    # booking, across every retry round and every radius expansion.
    #
    # NOT the same thing as offer-window-seconds above, and the two must
    # never be merged. The offer window is how long ONE driver has to answer
    # ONE offer. This is how long the whole search may take. They bound
    # different failures: a driver who does not look at her phone, versus a
    # rider left waiting because there is nobody out there.
    #
    # 90s is long enough for a few rounds with the radius doubling each
    # time, and short enough that a rider gets a real answer rather than an
    # endless spinner. Whichever runs out first - this or max-retries - ends
    # the search and the booking becomes NO_DRIVERS_AVAILABLE.
    #
    # The deadline is stamped onto the search when it starts, so changing
    # this never moves the deadline of a search already in flight.
    search-timeout-seconds: ${SEARCH_TIMEOUT_SECONDS:90}

  # Pricing lives entirely in configuration - there is not a rupee value in
  # the fare code. Every default below is a STARTING HYPOTHESIS shaped from
  # Rapido's published Hyderabad structure, not a final price: none of it
  # has been checked against what it actually costs a woman here to run a
  # scooter for an hour, and the first real driver feedback should move it.
  #
  # The individual rates are read as flat env vars (BIKE_PER_KM_RATE and so
  # on - see FareConfiguration) rather than nested keys, so whoever is
  # changing a price under pressure can find the name.
  fare:
    # Night windows are wall-clock, so they need a wall clock. Render runs
    # in UTC; reading a 22:00-06:00 window in UTC would apply the night
    # surcharge over breakfast and nothing at midnight.
    timezone: ${FARE_TIMEZONE:Asia/Kolkata}

  routing:
    # Real road distance and duration, from OSRM - open source, built on the
    # same OpenStreetMap data the maps and address search already use, so no
    # new vendor and no API key.
    #
    # THE PUBLIC DEMO SERVER IS A DEBT. router.project-osrm.org is run by
    # the OSRM project as a demonstration: documented rate limits, no uptime
    # guarantee, no support, and a usage policy that does not contemplate a
    # commercial service pricing its trips on it. Fine for development and a
    # small launch; not fine as the thing every fare in the city depends on.
    # The fix is to self-host - OSRM ships a Docker image and a
    # Hyderabad-sized extract is modest - once real traffic justifies the
    # instance. Point this at it and nothing else changes.
    osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    timeout-ms: ${ROUTING_TIMEOUT_MS:4000}
    # Used only when routing is unavailable. A rider must still be able to
    # book when a volunteer-run server is rate-limiting us, so the fallback
    # scales the straight line rather than refusing the trip. Erring high is
    # deliberate: the error then costs the rider a little, not the partner.
    road-distance-factor: ${ROAD_DISTANCE_FACTOR:1.4}
    fallback-speed-kmph: ${FALLBACK_SPEED_KMPH:22}

  payments:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      # Secret configured on the Razorpay dashboard's webhook settings for
      # this endpoint - used to verify X-Razorpay-Signature on incoming
      # webhook calls (see RazorpayPaymentGateway/RazorpayWebhookController).
      # Same blank-by-default treatment as key-id/key-secret above.
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  # Push notifications (Firebase Cloud Messaging) - all blank by default; push
  # is off until they are set, and nothing else depends on it.
  #   FIREBASE_PROJECT_ID / FIREBASE_CREDENTIALS_JSON: the service-account key
  #     the server sends with (a secret).
  #   FIREBASE_WEB_CONFIG_JSON / FIREBASE_VAPID_KEY: the web app config and Web
  #     Push certificate public key the apps register with (public values,
  #     served to them by GET /api/v1/notifications/push-config).
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    web-config-json: ${FIREBASE_WEB_CONFIG_JSON:}
    vapid-key: ${FIREBASE_VAPID_KEY:}

  notifications:
    sms:
      twilio:
        # Blank by default, same treatment as Razorpay's key-id/key-secret -
        # see TwilioSmsChannel's Javadoc for why there's no isConfigured()
        # gate before attempting a send even while these are unset.
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
    email:
      # Email is off until an SMTP server is configured through Spring Boot's
      # own variables - SPRING_MAIL_HOST, SPRING_MAIL_PORT,
      # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD - plus this sender address.
      # spring.mail.host is deliberately not defaulted in this file: even an
      # empty value switches mail on, pointing at nothing.
      from: ${MAIL_FROM:}

  testing:
    # TESTING AID ONLY, NOT A PRODUCT FEATURE - blank/unset by default,
    # same "opt-in via env var" treatment as auth's dev-otp-phone. When
    # set, BookingService.isCustomerVerified lets exactly this phone
    # number's account skip the real gender-verification check on booking
    # creation, so an automated QA pass can exercise the full booking flow
    # without a real admin-verified account. Never set this in a real
    # production environment.
    verified-bypass-phone: ${VERIFIED_BYPASS_PHONE:}
    # Same idea, driver side: lets one configured driver phone number go
    # ONLINE (DriverProfileService.setOnlineStatus) without real admin
    # verification - there's no self-service path to VERIFIED status at
    # all (see AdminVerificationController's Javadoc), so this was
    # otherwise a hard block on testing the online/dispatch flow live.
    verified-driver-bypass-phone: ${VERIFIED_DRIVER_BYPASS_PHONE:}

  admin:
    # Blank by default and a no-op when unset - an environment that never
    # sets this never gains an admin. Signup refuses role=ADMIN (see
    # AuthController.requireSelfServiceRole), so this is the only path to
    # an ADMIN account. The account must ALREADY exist: sign in normally
    # with this number first, then this promotes it on the next boot (see
    # AdminBootstrap). Unlike the bypass switches above, this IS meant to
    # be set in a real environment - it is how the operator gets access.
    bootstrap-phone: ${ADMIN_BOOTSTRAP_PHONE:}

# Error reporting. Blank DSN means the SDK starts disabled and sends nothing,
# which is what every local run and every fork of this repo gets; set
# SENTRY_DSN on the deployed service to turn it on. Personal data is scrubbed
# from outgoing events in platform.SentryConfig.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
  # No request headers, cookies, bodies or client IPs on events. This service
  # holds women's phone numbers and home addresses; an error report is not a
  # place any of that needs to travel to.
  send-default-pii: false
  # Errors only. Performance tracing samples ordinary successful requests,
  # which is a different product costing a different amount of quota, and the
  # free tier's transaction budget is spent in a day by a health check.
  traces-sample-rate: 0.0
  logging:
    # WARN and above become breadcrumbs, ERROR becomes an event - so a
    # handled failure that only ever got logged still surfaces.
    minimum-breadcrumb-level: warn
    minimum-event-level: error

management:
  health:
    mail:
      # An SMTP provider being slow or down must not mark the whole service
      # unhealthy: email is a fallback channel, and failed sends are recorded.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
