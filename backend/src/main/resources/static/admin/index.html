<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheOut Ops Console</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('sheout.admin.theme');
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<!--
  Deliberately one dependency-free static file served by the backend itself,
  rather than a fourth React app. No build step, no deploy of its own, and
  being same-origin it sidesteps CORS entirely.

  This is now a real product surface: non-technical operations staff approve
  drivers and answer safety alerts from it daily. So it reads as an admin
  tool - neutral, dense, legible - rather than borrowing the consumer app's
  illustrated style. SheOut's purple and orange appear only on the header,
  the active nav item and primary buttons, which is enough to place it as
  the same product without making an operational console feel playful.

  Every API call, the ADMIN role gate and the auth flow are unchanged from
  the previous version: this was a presentation and structure rebuild.
-->
<style>
  :root {
    /* Brand, used sparingly - header, active nav, primary actions only. */
    --brand: #4A1A9E;
    --brand-dark: #36116F;
    --brand-tint: #F1ECFA;
    --accent: #FCA325;

    /* Everything else is a neutral admin palette. */
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --line: #E3E5EA;
    --line-soft: #EFF1F4;
    --text: #1B1D21;
    --muted: #6B7280;
    --muted-soft: #9AA1AC;

    --amber: #92610A;   --amber-bg: #FDF4E3;  --amber-line: #F2DCAE;
    --green: #12734A;   --green-bg: #E9F6EF;  --green-line: #B6DFC9;
    --red:   #B3251C;   --red-bg:   #FCEDEB;  --red-line:   #F0C2BC;

    --panel-soft: #FAFBFC;
    --hover: #FAFAFD;
    --skel-a: #EDEFF3;  --skel-b: #F6F7F9;
    --blue: #1D4ED8;    --blue-bg: #EAF0FE;   --blue-line: #C5D6FB;
    --brand-line: #D9CCF3;
    --block: #7F1D1D;

    /* The wordmark's own two colours, taken from the apps' theme.css so the
       console's SHEOUT is the same SHEOUT the riders and partners see. The
       orange is the wordmark's, deeper than --accent, which on white would
       be too pale to read at sidebar size. */
    --word-she: #4A1A9E;
    --word-out: #F96717;

    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,29,33,.06), 0 4px 12px rgba(27,29,33,.05);
    color-scheme: light;
  }

  /*
   * The same console at night.
   *
   * An operator reading a verification queue at 2am is looking at a screen
   * that is otherwise the brightest thing in the room. The brand stays a
   * mid purple rather than lightening, because every button here puts white
   * text on it and a lavender would make those labels unreadable - which is
   * the mistake the apps avoid the other way round, by darkening their
   * label colour instead.
   *
   * data-theme is set before first paint by the script in <head>, so the
   * console never flashes white on the way in.
   */
  :root[data-theme="dark"] {
    --brand: #7C55E8;
    --brand-dark: #6A44D6;
    --brand-tint: #241C3D;
    --accent: #FFB545;

    --bg: #121118;
    --panel: #1B1A23;
    --panel-soft: #201F2A;
    --hover: #262533;
    --line: #2F2E3C;
    --line-soft: #26252F;
    --text: #ECEAF2;
    --muted: #A09BAF;
    --muted-soft: #7C7789;

    --amber: #F5C46B;   --amber-bg: #2E2413;  --amber-line: #4A3A1C;
    --green: #5FD39B;   --green-bg: #12291F;  --green-line: #1E4534;
    --red:   #FF8078;   --red-bg:   #2D1817;  --red-line:   #4A2523;

    --skel-a: #26252F;  --skel-b: #2F2E3A;
    --blue: #8FB0FF;    --blue-bg: #18213A;   --blue-line: #2A3760;
    --brand-line: #3A2F63;
    --block: #FF8078;

    --word-she: #B69BFF;
    --word-out: #FF8A4C;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Must beat the class rules below: .login-wrap and .shell both set
     display, which otherwise wins over the browser's [hidden] rule and
     leaves the sign-in pane rendered underneath the signed-in app. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; }
  button { font: inherit; }
  /* Links take the theme, not the browser's default blue - which in the
     dark theme was dark blue on near-black, and in the light one read as a
     different product from everything around it. */
  a { color: var(--brand); font-weight: 600; text-underline-offset: 2px; }
  a:hover { color: var(--brand-dark); }
  :root[data-theme="dark"] a { color: var(--word-she); }

  /* ---------- shell ---------- */
  /* minmax(0, 1fr), not 1fr: a bare 1fr column is at least as wide as its
     widest content, so one wide table - or, below 900px, the row of section
     tabs - widened the whole page and it scrolled sideways, instead of the
     table scrolling inside its card and the tabs inside their row. */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .shell > * { min-width: 0; }
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  /* The brand lockup: the apps' illustration and the SHEOUT wordmark, at the
     size of a console header rather than a splash screen. The illustration
     is a small copy of the design system's own asset (sheout-mark.png), on a
     transparent background so it sits on either theme. */
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 16px 14px; border-bottom: 1px solid var(--line-soft);
  }
  .brand .logo { width: 54px; height: 36px; flex: none; object-fit: contain; display: block; }
  .wordmark {
    font-weight: 850; font-size: 18px; line-height: 1; letter-spacing: .03em;
    color: var(--word-she); white-space: nowrap;
  }
  .wordmark span { color: var(--word-out); }
  .brand .sub {
    margin-top: 4px; font-size: 10.5px; color: var(--muted); font-weight: 650;
    text-transform: uppercase; letter-spacing: .09em;
  }

  .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted-soft); font-weight: 700; padding: 10px 10px 6px;
  }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border: 0; background: none; border-radius: 8px;
    color: var(--muted); cursor: pointer; text-align: left; font-weight: 550;
  }
  .nav button:hover { background: var(--bg); color: var(--text); }
  .nav button[aria-current="page"] { background: var(--brand-tint); color: var(--brand); font-weight: 650; }
  .nav button svg { width: 17px; height: 17px; flex: none; }
  .nav .count {
    margin-left: auto; font-size: 11px; font-weight: 700; min-width: 20px; text-align: center;
    padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--muted);
  }
  .nav button[aria-current="page"] .count { background: var(--brand); color: #fff; }

  .me { border-top: 1px solid var(--line-soft); padding: 12px 14px 14px; }
  .me .who { font-size: 12px; color: var(--muted); }
  .me .phone { font-weight: 650; font-size: 13px; word-break: break-all; }
  .me button {
    margin-top: 10px; width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
  }
  .me button:hover { border-color: var(--muted-soft); }
  .me .push-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; font-size: 12px; color: var(--muted); }
  .me .push-row span { flex: 1; min-width: 0; }
  .me .push-row button { width: auto; margin-top: 0; padding: 4px 10px; font-size: 12px; }
  .me .push-row.on span { color: var(--green); }

  /* ---------- content ---------- */
  .content { padding: 26px 28px 60px; max-width: 1400px; }
  .page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 62ch; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; font-weight: 550;
  }
  .btn:hover { border-color: var(--muted-soft); }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn-approve { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-approve:hover { filter: brightness(.94); }
  .btn-reject { background: var(--panel); border-color: var(--red-line); color: var(--red); }
  .btn-reject:hover { background: var(--red-bg); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  /* In the dark theme the green and red lighten so they read on a dark
     panel, and white labels on them stopped reading instead (about 2:1).
     Dark labels on the solid fills keep Approve, Mark paid and the urgent
     count legible. */
  :root[data-theme="dark"] .btn-approve { color: #0B2519; }
  :root[data-theme="dark"] .nav .count.urgent { color: #2B0F0D; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-head {
    padding: 13px 16px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .card-head h2 { font-size: 13px; font-weight: 700; }
  .card-head .hint { font-size: 12px; color: var(--muted); }
  .scroll { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 700; padding: 10px 14px;
    border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel-soft);
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th .arrow { opacity: .35; font-size: 10px; }
  th[aria-sort] .arrow { opacity: 1; color: var(--brand); }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--hover); }
  .num { font-variant-numeric: tabular-nums; }
  .subtle { color: var(--muted); font-size: 12px; }
  .strong { font-weight: 600; }

  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 650; white-space: nowrap; border: 1px solid;
  }
  .b-amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-line); }
  .b-green { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
  .b-red   { color: var(--red);   background: var(--red-bg);   border-color: var(--red-line); }
  .b-grey  { color: var(--muted); background: var(--bg);       border-color: var(--line); }
  /* Account type, deliberately not in the amber/green/red status palette -
     a role is not a status and must not read like one. */
  .b-role-driver   { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-line); }
  .b-role-customer { color: var(--brand); background: var(--brand-tint); border-color: var(--brand-line); }

  /* Blocked is neither a role nor one of the three status tones, and must
     not be mistaken for either. Status badges are pale tints; a role badge
     is a pale tint in a different hue. This is the only solid-filled badge
     in the console, so a blocked account is unmistakable at a glance down a
     column of otherwise pale pills. */
  .b-blocked {
    color: var(--panel); background: var(--block); border-color: var(--block);
    letter-spacing: .02em; text-transform: uppercase; font-size: 10.5px;
  }

  .wait { font-weight: 650; }
  .wait.warn { color: var(--amber); }
  .wait.bad { color: var(--red); }

  /* ---------- filters + pager ---------- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    padding: 13px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .filters .f { display: flex; flex-direction: column; gap: 4px; }
  .filters .f > span { font-size: 11px; font-weight: 650; color: var(--muted); }
  /* One height for every control, so a date box and a dropdown side by side
     line up - browsers give each a different natural height. */
  .filters input, .filters select {
    height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 13px; background: var(--panel); color: var(--text);
  }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--brand); }
  .filters .f.wide input { min-width: 230px; }
  .filters .spacer { margin-left: auto; }
  .filters .active {
    align-self: center; font-size: 12px; font-weight: 650; color: var(--brand);
  }

  .pager {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-top: 1px solid var(--line-soft); font-size: 13px;
  }
  .pager .count { color: var(--muted); }
  .pager .controls { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .pager button {
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  .pager button:hover:not([disabled]) { border-color: var(--muted-soft); }
  .pager button[disabled] { opacity: .45; cursor: not-allowed; }
  .pager .of { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- states ---------- */
  .state { padding: 44px 20px; text-align: center; color: var(--muted); }
  .state svg { width: 40px; height: 40px; color: var(--muted-soft); margin-bottom: 10px; }
  .state h3 { font-size: 14px; color: var(--text); font-weight: 650; margin-bottom: 3px; }
  .state p { margin: 0; font-size: 13px; }
  .state.error svg { color: var(--red); }
  .skel { height: 11px; border-radius: 6px; background: linear-gradient(90deg,var(--skel-a) 25%,var(--skel-b) 37%,var(--skel-a) 63%);
          background-size: 400% 100%; animation: sh 1.3s ease infinite; }
  @keyframes sh { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  /* Skeletons shaped like what is coming - a text block, a document, a
     ticket thread - rather than a line of text saying "Loading". The page
     should already look like itself before the data arrives. */
  .skel.w40 { width: 40%; } .skel.w60 { width: 60%; } .skel.w80 { width: 80%; }
  .skel.tall { height: 64px; border-radius: 8px; }
  .skel.doc-skel { height: 330px; border-radius: 0; }
  .skel-stack { display: flex; flex-direction: column; gap: 10px; }
  .skel-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }

  .banner { padding: 11px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; border: 1px solid; }
  .banner-err { background: var(--red-bg); border-color: var(--red-line); color: var(--red); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(27,29,33,.46); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 460px; box-shadow: 0 18px 48px rgba(0,0,0,.22); }
  .modal.wide { max-width: 680px; }
  .modal-head { padding: 18px 20px 0; }
  .modal-head h3 { font-size: 16px; font-weight: 700; }
  .modal-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .modal-body { padding: 16px 20px; max-height: 62vh; overflow-y: auto; }
  .modal-foot { padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line-soft); }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .modal textarea, .modal input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: var(--panel); color: var(--text);
  }
  .modal textarea { min-height: 74px; resize: vertical; }

  .kv { display: grid; grid-template-columns: 132px 1fr; gap: 7px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 550; }

  .check {
    border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 12px;
  }
  .check .top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .check .top h4 { margin: 0; font-size: 13.5px; font-weight: 700; }
  .check p { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  .check .row { display: flex; gap: 8px; flex-wrap: wrap; }

  .doc { margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .doc img { display: block; width: 100%; max-height: 330px; object-fit: contain; background: var(--panel-soft); }
  .doc .fallback { padding: 16px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .doc .doc-pdf { display: block; width: 100%; height: 330px; border: 0; background: var(--panel-soft); }
  .doc .doc-foot { padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12px; background: var(--panel); }
  .doc .doc-foot a { color: var(--brand); font-weight: 600; }
  .doc .fallback code { word-break: break-all; background: var(--panel); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); }
  /* Side by side, because the whole point is reading one against the other.
     Stacks on a narrow window rather than squeezing both into unreadable
     columns. */
  .docs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  @media (max-width: 900px) { .docs { grid-template-columns: 1fr; } }
  .doc-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .doc-hint { font-weight: 400; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- support tickets ---------- */
  /* A sidebar count that needs someone now. Red rather than the brand
     purple, because it is not "this is the page you are on" - it is "there
     is a safety or high-priority ticket nobody has resolved". */
  .nav .count.urgent, .nav button[aria-current="page"] .count.urgent { background: var(--red); color: #fff; }
  .banner-info { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber); display: flex; align-items: center; gap: 12px; }
  .banner-info .btn { margin-left: auto; }

  .thread { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .msg { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--panel); max-width: 88%; }
  .msg .who { font-size: 11.5px; font-weight: 650; color: var(--muted); margin-bottom: 2px; display: flex; gap: 8px; align-items: center; }
  .msg .body { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .msg.raiser { align-self: flex-start; background: var(--bg); }
  .msg.staff { align-self: flex-end; background: var(--brand-tint); border-color: var(--brand-line); }
  /* Internal notes must never be mistaken for a reply the rider can read,
     so they look nothing like one: amber, dashed, and labelled. */
  .msg.internal { align-self: stretch; max-width: none; background: var(--amber-bg); border: 1px dashed var(--amber-line); }
  .msg.internal .body { color: var(--text); }

  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 700px) { .controls-grid { grid-template-columns: 1fr; } }
  .controls-grid .check { margin-top: 0; }
  .modal select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: var(--panel); color: var(--text); margin-bottom: 8px;
  }
  .modal .toggle { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 12.5px; color: var(--text); font-weight: 550; }
  .modal .toggle input { width: auto; margin: 0; }
  .reply-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .reply-row .hint { font-size: 12px; color: var(--muted); }
  .reply-row .btn { margin-left: auto; }
  .sos-link { border: 1px solid var(--red-line); background: var(--red-bg); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 12.5px; color: var(--red); }

  /* ---------- panels: sections that are not a table ---------- */
  /* Shown inside the shared card in place of the table, so a section that is
     a list of editors still gets the card, its header and its filter bar. */
  .panel { padding: 4px 16px 16px; }
  .panel > .state { padding-top: 36px; }

  /* A second card above the shared one, for a section that composes as well
     as lists (Announcements). */
  .above-card { margin-bottom: 16px; }

  /* ---------- form fields ---------- */
  /* The console's one field style, for forms that sit on the page rather
     than in a modal. Same border, radius and focus ring as the filters. */
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field > span { font-size: 12px; font-weight: 650; color: var(--muted); }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 13.5px; background: var(--panel); color: var(--text);
  }
  .field input, .field select { height: 36px; padding: 0 10px; }
  .field textarea { padding: 9px 10px; line-height: 1.5; resize: vertical; min-height: 92px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  .field .count { align-self: flex-end; font-size: 11.5px; color: var(--muted-soft); font-variant-numeric: tabular-nums; }

  .compose { padding: 16px; display: grid; gap: 14px; }
  .compose .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .compose .row .field { flex: 0 1 220px; }
  .compose .sms {
    flex: 1 1 280px; display: flex; gap: 9px; align-items: flex-start;
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 12.5px; color: var(--muted); cursor: pointer;
  }
  .compose .sms input { margin: 2px 0 0; flex: none; }
  .compose .sms strong { color: var(--text); font-weight: 650; }
  .compose .sms:has(input:checked) { border-color: var(--amber-line); background: var(--amber-bg); color: var(--amber); }
  .compose .send { margin-left: auto; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 60ch; }
  .nowrap { white-space: nowrap; }

  /* ---------- content ---------- */
  .content-group { margin-top: 18px; }
  .content-group > h3 {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 8px;
  }
  .content-group > h3 .badge { text-transform: none; letter-spacing: 0; }
  .cb { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel); }
  .cb.dirty { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  .cb .where { font-weight: 600; font-size: 13px; }
  .cb .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted-soft); }
  .cb textarea {
    width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 13.5px; line-height: 1.5; resize: vertical; min-height: 40px;
    color: var(--text); background: var(--panel);
  }
  .cb textarea:focus { outline: none; border-color: var(--brand); }
  .cb .foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .cb .foot .meta { font-size: 12px; color: var(--muted); }
  .cb .foot .chars { font-size: 11.5px; color: var(--muted-soft); margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ---------- toasts ---------- */
  .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: flex; flex-direction: column; gap: 9px; max-width: 380px; }
  .toast {
    padding: 12px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16);
    font-size: 13px; display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border-left: 4px solid var(--muted);
    animation: rise .18s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } }
  .toast.ok { border-left-color: var(--green); }
  .toast.bad { border-left-color: var(--red); }
  .toast strong { display: block; font-size: 13px; }
  .toast span { color: var(--muted); font-size: 12.5px; }

  /* ---------- login ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 22px; }
  .login { width: 100%; max-width: 380px; }
  .login .card { padding: 26px; }
  .login .brand { border: 0; padding: 0 0 18px; }
  .login h2 { font-size: 17px; font-weight: 700; }
  .login p.lead { margin: 5px 0 18px; color: var(--muted); font-size: 13px; }
  .login label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .login .btn { width: 100%; margin-top: 16px; padding: 11px; }

  /* Phone entry, mirroring the apps' PhoneField: a fixed +91 chip outside
     the input, and ten digits inside it. */
  .theme-row { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-bottom: 8px; }
  .theme-row button {
    flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 4px; border-radius: 999px; cursor: pointer;
  }
  .theme-row button[aria-checked="true"] { background: var(--brand); color: #fff; }

  .phone-field { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .phone-field:focus-within { border-color: var(--brand); }
  .phone-field .cc {
    display: flex; align-items: center; padding: 0 11px; font-size: 13px; font-weight: 650;
    color: var(--text); background: var(--bg); border-right: 1px solid var(--line);
  }
  .phone-field input { border: 0; border-radius: 0; letter-spacing: .5px; }
  .phone-field input:focus { outline: none; }
  .phone-field.bad { border-color: var(--red); }
  .field-err { margin: 6px 0 0; font-size: 12px; color: var(--red); }

  /* ---------- responsive: tablet and below ---------- */
  /* A narrower sidebar on a small laptop or a tablet held sideways, so the
     tables keep their columns. */
  @media (max-width: 1180px) {
    .shell { grid-template-columns: 220px minmax(0, 1fr); }
    .content { padding: 22px 20px 56px; }
  }
  @media (max-width: 900px) {
    /* The rows are sized to their content. Left to stretch, the grid shared
       the screen's height between the two rows and the tab strip grew to a
       third of the screen, with every tab as tall as the strip. */
    .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .side { position: static; height: auto; flex-direction: column; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 12px 16px 10px; }
    .nav { flex: none; flex-direction: row; align-items: center; overflow-x: auto; padding: 8px 10px; gap: 6px; scrollbar-width: thin; }
    .nav .label { display: none; }
    .nav button { width: auto; flex: none; white-space: nowrap; }
    .me { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line-soft); }
    .me .who-wrap { flex: 1; min-width: 0; }
    .me button { width: auto; margin-top: 0; flex: none; }
    .content { padding: 20px 16px 48px; }
    .kv { grid-template-columns: 1fr; gap: 2px 0; }
    .kv dt { margin-top: 8px; }
  }
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->

<script>
const API = '/api/v1';
let token = localStorage.getItem('sheout.admin.token') || '';
let tab = 'queue';
let sort = { key: null, dir: 'asc' };
let lastRows = [];

const $ = id => document.getElementById(id);
/**
 * Escapes for HTML. Single quotes and backticks are in the set on purpose:
 * without them a value placed inside a single-quoted attribute, or inside a
 * JS string built into markup, can close its own delimiter and run. There
 * was exactly one such site here (the document image's onerror handler),
 * and it was safe only because an upload filename is sanitised to
 * [A-Za-z0-9._-] two modules away - a guarantee this file cannot see and
 * should not be relying on.
 */
const esc = v => (v === null || v === undefined || v === '')
  ? '—'
  : String(v).replace(/[&<>"'`]/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;',
    }[c]));
const time = v => v ? new Date(v).toLocaleString() : '—';
/**
 * esc() for a value going into an input: empty stays empty. esc() prints an
 * em dash for a missing value, which is right in a table cell and wrong in a
 * search box - every search box started out containing one, and typing an
 * address after it searched for "—address" and matched nothing.
 */
const escValue = v => (v === null || v === undefined || v === '') ? '' : esc(v);

/**
 * Plain language for the raw enum values. Operations staff should never
 * have to learn that UNDER_REVIEW means "someone needs to look at this".
 */
const STATUS_TEXT = {
  UNDER_REVIEW: 'Awaiting review', PENDING: 'Not yet submitted',
  VERIFIED: 'Approved', REJECTED: 'Rejected',
  REQUESTED: 'Requested', MATCHED: 'Driver matched', ACCEPTED: 'Accepted',
  IN_PROGRESS: 'In progress', COMPLETED: 'Completed', CANCELLED: 'Cancelled',
  // Not 'Cancelled'. Nobody cancelled this one - the search ran out and
  // found nobody, which is a supply problem to act on, not a rider
  // changing her mind. Collapsing the two would hide exactly the number an
  // operator needs to see.
  NO_DRIVERS_AVAILABLE: 'No drivers found',
  CAPTURED: 'Paid', FAILED: 'Failed', REFUNDED: 'Refunded', RESOLVED: 'Resolved',
  // Support tickets. IN_PROGRESS and RESOLVED already read correctly above.
  OPEN: 'Open', CLOSED: 'Closed',
};
const STATUS_TONE = {
  UNDER_REVIEW: 'amber', PENDING: 'amber', REQUESTED: 'amber', MATCHED: 'amber',
  ACCEPTED: 'amber', IN_PROGRESS: 'amber',
  VERIFIED: 'green', COMPLETED: 'green', CAPTURED: 'green', RESOLVED: 'green',
  REJECTED: 'red', FAILED: 'red', CANCELLED: 'red', REFUNDED: 'red',
  // Amber, not red: this is the platform falling short, not misconduct.
  NO_DRIVERS_AVAILABLE: 'amber',
  OPEN: 'amber', CLOSED: 'grey',
};
const TICKET_CATEGORY_TEXT = {
  SAFETY_CONCERN: 'Safety concern', PAYMENT_DISPUTE: 'Payment dispute',
  DRIVER_OR_CUSTOMER_BEHAVIOR: 'Behaviour', CANCELLATION_DISPUTE: 'Cancellation dispute',
  APP_ISSUE: 'App issue', OTHER: 'Other',
};
const PRIORITY_TEXT = { HIGH: 'High', MEDIUM: 'Medium', LOW: 'Low' };
const ticketCategoryText = v => TICKET_CATEGORY_TEXT[v] || humanize(v);
function priorityBadge(p) {
  const tone = p === 'HIGH' ? 'b-red' : p === 'MEDIUM' ? 'b-amber' : 'b-grey';
  return `<span class="badge ${tone}">${esc(PRIORITY_TEXT[p] || humanize(p))}</span>`;
}
/**
 * The same treatment for the other enums the API returns. Status had this
 * already, but the Bookings table printed the service as "PARCEL" over
 * "DELIVERY" and the payment method as "CASH", which is the API's
 * vocabulary rather than an operator's - and it sat one column away from a
 * status that was written out properly, so the row read as half-finished.
 */
const SERVICE_TEXT = {
  BIKE: 'Bike Taxi', AUTO: 'Auto Ride', CAB: 'Cab Ride',
  PARCEL: 'Parcel Delivery', LUNCHBOX: 'Lunch Box Delivery',
};
const TRIP_TYPE_TEXT = { RIDE: 'Ride', DELIVERY: 'Delivery' };
const PAY_METHOD_TEXT = { UPI: 'UPI', CASH: 'Cash' };

/** Any unmapped value degrades to sentence case rather than shouting. */
function humanize(v) {
  if (!v) return '';
  const s = String(v).replace(/_/g, ' ').toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const serviceText = v => SERVICE_TEXT[v] || humanize(v);
const tripTypeText = v => TRIP_TYPE_TEXT[v] || humanize(v);
const payMethodText = v => PAY_METHOD_TEXT[v] || humanize(v);

/**
 * A customer only ever needs the ID/gender check - the police column is
 * null for every CUSTOMER record, so showing it as a status would invent a
 * check that does not apply to them.
 */
function isCustomer(r) { return r && r.role === 'CUSTOMER'; }

function roleBadge(role) {
  if (role === 'CUSTOMER') return '<span class="badge b-role-customer">Customer</span>';
  if (role === 'DRIVER') return '<span class="badge b-role-driver">Driver</span>';
  return `<span class="badge b-grey">${esc(role || 'Unknown')}</span>`;
}

/** A rupee amount from the API's decimal, always with paise: "₹1,250.00". */
function rupees(amount) {
  const n = Number(amount);
  if (!Number.isFinite(n)) return '—';
  return (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function badge(v) {
  if (!v) return '<span class="badge b-grey">—</span>';
  return `<span class="badge b-${STATUS_TONE[v] || 'grey'}">${esc(STATUS_TEXT[v] || v)}</span>`;
}

/** "3 days" / "4 hours" / "12 minutes", plus a tone once it has been too long. */
function waited(iso) {
  if (!iso) return { text: '—', cls: '' };
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  const text = mins < 60 ? `${mins} min`
    : mins < 1440 ? `${Math.round(mins / 60)} hr`
    : `${Math.round(mins / 1440)} d`;
  const cls = mins >= 2880 ? 'bad' : mins >= 1440 ? 'warn' : '';
  return { text, cls, mins };
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(options.headers || {})
    }
  });
  if (res.status === 401 || res.status === 403) {
    // 401: the session is over - operator sign-ins last a working day, and
    // can be ended from elsewhere. 403: signed in, but not as an operator -
    // a role gate, genuinely distinct from the 404 per-resource checks return.
    signOut(res.status === 401
      ? 'Your session has ended. Operator sign-ins last 12 hours - sign in again to continue.'
      : 'Your session is not authorised as an operations account. Sign in with an admin account.');
    throw new Error('unauthorized');
  }
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.message) || `Request failed (${res.status})`);
  return body;
}

// ---- toasts ---------------------------------------------------------------
function toast(kind, title, detail) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'ok' ? 'ok' : 'bad');
  el.innerHTML = `<div><strong>${esc(title)}</strong>${detail ? `<span>${esc(detail)}</span>` : ''}</div>`;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; setTimeout(() => el.remove(), 220); }, 4200);
}

// ---- modal ----------------------------------------------------------------
function closeModal() { $('modalRoot').innerHTML = ''; document.body.style.overflow = ''; }
function openModal(html, opts = {}) {
  document.body.style.overflow = 'hidden';
  $('modalRoot').innerHTML = `<div class="overlay" data-overlay><div class="modal ${opts.wide ? 'wide' : ''}">${html}</div></div>`;
  $('modalRoot').querySelector('[data-overlay]').addEventListener('click', e => {
    if (e.target.hasAttribute('data-overlay')) closeModal();
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/**
 * Every irreversible action goes through this. Approving or rejecting a
 * driver, or resolving a safety alert, has real consequences and an ops
 * person who clicked the wrong row deserves the chance to catch it.
 */
function confirmAction({
  title,
  message,
  confirmLabel,
  tone = 'primary',
  withReason = false,
  /** Blocking needs one; rejecting a document does not. */
  reasonRequired = false,
  reasonLabel = 'Reason (optional, shared with the driver)',
  reasonPlaceholder = 'e.g. Document is blurred and the name cannot be read',
  /** What to say when a required reason is left blank. */
  reasonMissing = 'Please say why. This is kept as the record of the decision.',
  reasonMaxLength = null,
}) {
  return new Promise(resolve => {
    openModal(`
      <div class="modal-head"><h3>${esc(title)}</h3><p>${esc(message)}</p></div>
      <div class="modal-body">
        ${withReason ? `<label for="reasonInput">${esc(reasonLabel)}</label>
        <textarea id="reasonInput" placeholder="${esc(reasonPlaceholder)}"${reasonMaxLength ? ` maxlength="${Number(reasonMaxLength)}"` : ''}></textarea>
        <p class="field-err" id="reasonErr" hidden>${esc(reasonMissing)}</p>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn" data-cancel type="button">Cancel</button>
        <button class="btn ${tone === 'approve' ? 'btn-approve' : tone === 'reject' ? 'btn-reject' : 'btn-primary'}" data-go type="button">${esc(confirmLabel)}</button>
      </div>`);
    const root = $('modalRoot');
    root.querySelector('[data-cancel]').addEventListener('click', () => { closeModal(); resolve(null); });
    root.querySelector('[data-go]').addEventListener('click', () => {
      const box = withReason ? root.querySelector('#reasonInput') : null;
      const reason = box ? box.value.trim() : '';
      // Refused here as well as by the API. The server is the rule, but
      // finding out after the dialog closed would lose what was typed.
      if (reasonRequired && !reason) {
        root.querySelector('#reasonErr').hidden = false;
        box.focus();
        return;
      }
      closeModal();
      resolve({ reason: reason || null });
    });
  });
}

let awaitingCode = false;

// Mirrors normalizeDigits/isCompletePhone in the design system's PhoneField.
const PHONE_DIGITS = 10;
const cleanPhone = raw => String(raw).replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '').slice(0, PHONE_DIGITS);

// Rejected as typed, not only on submit - a field that silently accepts a
// letter and then complains later reads as broken.
$('phone').addEventListener('input', e => {
  const cleaned = cleanPhone(e.target.value);
  if (e.target.value !== cleaned) e.target.value = cleaned;
  if (cleaned.length === PHONE_DIGITS) showPhoneError(false);
});

function showPhoneError(show) {
  $('phoneWrap').classList.toggle('bad', show);
  $('phoneErr').hidden = !show;
}

// Same six-digit numeric-only treatment the two apps give their OTP box.
$('code').addEventListener('input', e => {
  const cleaned = String(e.target.value).replace(/\D/g, '').slice(0, 6);
  if (e.target.value !== cleaned) e.target.value = cleaned;
});

$('login').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').hidden = true;
  const digits = cleanPhone($('phone').value);
  if (digits.length !== PHONE_DIGITS) {
    showPhoneError(true);
    $('phone').focus();
    return;
  }
  showPhoneError(false);
  const phoneNumber = '+91' + digits;
  try {
    if (!awaitingCode) {
      await api('/auth/otp/request', { method: 'POST', body: JSON.stringify({ phoneNumber, role: 'ADMIN' }) });
      awaitingCode = true;
      $('codeRow').hidden = false;
      $('loginBtn').textContent = 'Sign in';
      $('code').focus();
      return;
    }
    const out = await api('/auth/otp/verify', {
      method: 'POST',
      body: JSON.stringify({ phoneNumber, code: $('code').value.trim(), role: 'ADMIN' })
    });
    token = out.accessToken;
    localStorage.setItem('sheout.admin.token', token);
    localStorage.setItem('sheout.admin.phone', phoneNumber);
    start();
  } catch (err) {
    if (err.message === 'unauthorized') return;
    $('loginErr').textContent = err.message;
    $('loginErr').hidden = false;
  }
});

function signOut(message) {
  // Before the token is cleared: the unregister request needs it.
  dropPushDevice();
  token = '';
  localStorage.removeItem('sheout.admin.token');
  awaitingCode = false;
  $('codeRow').hidden = true;
  $('code').value = '';
  showPhoneError(false);
  $('loginBtn').textContent = 'Send code';
  $('app').hidden = true;
  $('loginWrap').hidden = false;
  closeModal();
  if (message) { $('loginErr').textContent = message; $('loginErr').hidden = false; }
}
$('logout').addEventListener('click', async () => {
  const ok = await confirmAction({
    title: 'Log out of the ops console?',
    message: 'You will need your mobile number and a one-time code to sign back in.',
    confirmLabel: 'Log out',
  });
  if (ok) signOut(null);
});

/** An empty or error state: icon, heading, one line. The one shape for all of them. */
function stateBlock({ icon, title, text }, kind = '') {
  return `<div class="state ${kind}">${icon || ''}<h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}</div>`;
}
function errorState(message) {
  return stateBlock({ icon: ICON_ERROR, title: 'Could not load this section', text: message }, 'error');
}

/** Rows per page. Dense table on a wide screen, so more than a phone list. */
const PAGE_SIZE = 25;

/**
 * Filter and page state, kept per section.
 *
 * Per section rather than one shared object: switching from Bookings to
 * Accounts and back should not silently carry a status filter across, and a
 * date range that means something in one table means nothing in the other.
 */
const filterState = {};

function stateFor(name) {
  if (!filterState[name]) filterState[name] = { page: 0 };
  return filterState[name];
}

/**
 * Turns the current filter state into a query string.
 *
 * A blank filter is omitted entirely, not sent empty: the backend cannot
 * parse `status=` into an enum, while an absent `status` correctly means
 * "do not narrow". Dates are widened to the whole local day - a "to" of
 * today means through the end of today, and the off-by-one there hides a
 * day's worth of rows.
 */
function filterQuery(state, extra = {}) {
  const params = new URLSearchParams();
  for (const [key, value] of Object.entries({ ...state, ...extra })) {
    if (value === '' || value === null || value === undefined) continue;
    if (key === 'from') params.set('from', new Date(`${value}T00:00:00`).toISOString());
    else if (key === 'to') params.set('to', new Date(`${value}T23:59:59.999`).toISOString());
    else params.set(key, String(value));
  }
  const query = params.toString();
  return query ? `?${query}` : '';
}

/** How many filters are narrowing the list. page is not a filter. */
function activeFilterCount(view, state) {
  if (!view.filters) return 0;
  return view.filters.filter(f => state[f.key] !== undefined && state[f.key] !== '').length;
}

function paintFilters(view) {
  const host = $('filters');
  if (!view.filters) { host.hidden = true; host.innerHTML = ''; return; }
  const state = stateFor(tab);
  const count = activeFilterCount(view, state);
  host.hidden = false;
  host.innerHTML = view.filters.map(f => {
    const value = state[f.key] ?? '';
    if (f.kind === 'text') {
      return `<label class="f ${f.wide ? 'wide' : ''}"><span>${esc(f.label)}</span>
        <input type="search" data-filter="${esc(f.key)}" placeholder="${esc(f.placeholder || '')}" value="${escValue(value)}"></label>`;
    }
    if (f.kind === 'date') {
      return `<label class="f"><span>${esc(f.label)}</span>
        <input type="date" data-filter="${esc(f.key)}" value="${escValue(value)}"></label>`;
    }
    const options = f.options().map(o =>
      `<option value="${esc(o.value)}"${String(value) === String(o.value) ? ' selected' : ''}>${esc(o.label)}</option>`).join('');
    return `<label class="f"><span>${esc(f.label)}</span>
      <select data-filter="${esc(f.key)}"><option value="">${esc(f.any)}</option>${options}</select></label>`;
  }).join('')
    + (count > 0
      ? `<span class="spacer"></span><span class="active">${count} filter${count === 1 ? '' : 's'} applied</span>
         <button class="btn" data-clear-filters type="button">Clear filters</button>`
      : '');

  // The value is re-read from the DOM on every change rather than tracked
  // per keystroke, and a text box waits before reloading so typing an
  // address does not fire a request per letter.
  host.querySelectorAll('[data-filter]').forEach(el => {
    const commit = () => {
      const s = stateFor(tab);
      s[el.dataset.filter] = el.value;
      s.page = 0;
      render({ keepFocus: el.dataset.filter });
    };
    if (el.type === 'search') {
      let timer;
      el.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(commit, 400); });
    } else {
      el.addEventListener('change', commit);
    }
  });
  const clear = host.querySelector('[data-clear-filters]');
  if (clear) clear.addEventListener('click', () => { filterState[tab] = { page: 0 }; render(); });
}

function paintPager(paged) {
  const host = $('pager');
  if (!paged) { host.hidden = true; host.innerHTML = ''; return; }
  const { page, totalItems, totalPages, hasMore } = paged;
  if (totalItems === 0) { host.hidden = true; host.innerHTML = ''; return; }
  const first = page * paged.pageSize + 1;
  const last = first + paged.items.length - 1;
  host.hidden = false;
  // Numbered pages rather than load-more, unlike the phone screens: an
  // operator scanning a dense grid on a wide screen wants to jump, and
  // knowing there are four pages is itself information.
  host.innerHTML = `
    <span class="count">Showing <strong>${first}–${last}</strong> of <strong>${totalItems}</strong></span>
    <span class="controls">
      <button data-page="0" type="button" ${page === 0 ? 'disabled' : ''}>First</button>
      <button data-page="${page - 1}" type="button" ${page === 0 ? 'disabled' : ''}>Previous</button>
      <span class="of">Page ${page + 1} of ${Math.max(totalPages, 1)}</span>
      <button data-page="${page + 1}" type="button" ${hasMore ? '' : 'disabled'}>Next</button>
      <button data-page="${Math.max(totalPages - 1, 0)}" type="button" ${hasMore ? '' : 'disabled'}>Last</button>
    </span>`;
  host.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => {
    stateFor(tab).page = Math.max(Number(b.dataset.page), 0);
    render();
  }));
}

/**
 * A cancellation rate, with the counts it came from.
 *
 * Both halves, always. A bare "50%" is unreadable without knowing whether
 * it is one trip out of two or four hundred out of eight hundred, and an
 * operator about to remove somebody's access should never have to guess
 * which. The colour is a hint, not a verdict.
 */
function rateCell(stats) {
  if (!stats || !stats.totalBookings) {
    return '<span class="subtle">No trips yet</span>';
  }
  const percent = Math.round((stats.totalCancellations / stats.totalBookings) * 100);
  const tone = percent >= 40 ? 'b-red' : percent >= 20 ? 'b-amber' : 'b-green';
  return `<span class="badge ${tone}">${percent}%</span>
    <div class="subtle num">${stats.totalCancellations} of ${stats.totalBookings} trips</div>`;
}

/**
 * An average rating, with how many opinions it is made of.
 *
 * "Not rated yet" is not a score, and must never render as 0.0 or as a red
 * badge. A partner nobody has rated would otherwise sort and read as the
 * worst person on the platform on the strength of no evidence at all.
 *
 * The count is shown for the same reason the cancellation cell shows its
 * denominator: 2.0 from two riders on a bad night and 2.0 from forty are
 * different facts, and an operator deciding whether to remove somebody's
 * livelihood should not have to guess which one they are looking at.
 */
function ratingCell(stats) {
  if (!stats || !stats.totalRatings || stats.averageStars == null) {
    return '<span class="subtle">Not rated yet</span>';
  }
  const average = Number(stats.averageStars);
  const tone = average < 3.5 ? 'b-red' : average < 4.2 ? 'b-amber' : 'b-green';
  return `<span class="badge ${tone}">★ ${average.toFixed(2)}</span>
    <div class="subtle num">${stats.totalRatings} rating${stats.totalRatings === 1 ? '' : 's'}</div>`;
}

// ---- driver detail + decisions -------------------------------------------
/**
 * The two checks are approved or rejected separately because the backend
 * exposes them as two endpoints and they are genuinely two decisions - an ID
 * can be fine while a police record is still outstanding.
 */
/**
 * Draws one stored document into a box, whatever the storage backend hands
 * back.
 *
 * Extracted so both documents render identically. It used to be inline for
 * the single document, and duplicating it for the second would have meant
 * two copies of the escaping rules below - which is exactly the kind of
 * thing that stays right in one copy and drifts in the other.
 *
 * Built with DOM calls and a real listener rather than an onerror attribute
 * containing a JS string containing more markup. That nesting meant the
 * document URL had to survive three escaping contexts at once, and any one
 * of them getting it wrong would run whatever the URL said inside a
 * signed-in admin's session. Nothing is interpolated into markup here.
 */
async function renderDocument(box, url, alt) {
  if (!box) return;
  // Local deployments store documents on disk and hand back a file:// URL,
  // which a browser will not render from a page. Show the path rather than
  // an empty frame that looks broken.
  if (String(url || '').startsWith('file:')) {
    box.innerHTML = `<div class="fallback">Stored on the server's local disk, which a browser cannot display directly.<br><code>${esc(url)}</code></div>`;
    return;
  }

  box.innerHTML = '<div class="skel doc-skel" aria-label="Loading document"></div>';

  // FETCHED, NOT JUST DROPPED INTO AN <img>. Two things an <img> cannot do:
  // it cannot say why nothing appeared, and it cannot show a PDF - and both
  // happen here for real. The ID is whatever she photographed or scanned,
  // so a PDF is ordinary; and a document uploaded before a storage change
  // is gone, which used to render as a silently broken image frame with no
  // hint that the file, rather than the console, was the problem.
  let response;
  try {
    response = await fetch(url);
  } catch (err) {
    box.innerHTML = '<div class="fallback">Could not reach the server for this document. Check the connection and reopen this review.</div>';
    return;
  }

  if (response.status === 404 || response.status === 410) {
    box.innerHTML = `<div class="fallback"><strong>This document is no longer stored.</strong><br>
      It was submitted before the current document storage, so the file itself is gone even though the record says one was sent.
      Ask her to submit it again from the app, then review it here. Do not approve on the strength of a missing document.</div>`;
    return;
  }
  if (!response.ok) {
    box.innerHTML = `<div class="fallback">Could not load this document (${response.status}). <a href="${esc(url)}" target="_blank" rel="noreferrer">Open it directly</a>.</div>`;
    return;
  }

  const type = (response.headers.get('content-type') || '').toLowerCase();
  const blobUrl = URL.createObjectURL(await response.blob());
  box.textContent = '';

  if (type.startsWith('image/')) {
    const img = document.createElement('img');
    img.alt = alt;
    img.src = blobUrl;
    box.append(img);
  } else if (type.includes('pdf')) {
    const frame = document.createElement('iframe');
    frame.src = blobUrl;
    frame.title = alt;
    frame.className = 'doc-pdf';
    box.append(frame);
  } else {
    const unknown = document.createElement('div');
    unknown.className = 'fallback';
    unknown.textContent = `This file is a ${type || 'file of an unknown type'}, which cannot be shown here. `;
    box.append(unknown);
  }

  // Always: the frame is small and an operator checking a face against a
  // name needs to be able to look at it properly.
  const foot = document.createElement('div');
  foot.className = 'doc-foot';
  const open = document.createElement('a');
  open.href = blobUrl;
  open.target = '_blank';
  open.rel = 'noreferrer';
  open.textContent = 'Open full size';
  foot.append(open);
  box.append(foot);
}

function openDriver(r) {
  const w = waited(r.updatedAt);
  openModal(`
    <div class="modal-head">
      <h3>${esc(r.name || 'Name not set')} ${roleBadge(r.role)}</h3>
      <p>${esc(r.phoneNumber || '')} &middot; waiting ${esc(w.text)}</p>
    </div>
    <div class="modal-body">
      <dl class="kv">
        <dt>Account type</dt><dd>${roleBadge(r.role)}</dd>
        <dt>Submitted</dt><dd>${time(r.updatedAt)}</dd>
        <dt>ID &amp; gender check</dt><dd>${badge(r.genderVerificationStatus)}</dd>
        ${isCustomer(r) ? '' : `<dt>Police check</dt><dd>${badge(r.policeVerificationStatus)}</dd>`}
      </dl>

      <!-- Both documents together, because this is one decision made from
           two pieces of evidence: who she is, and whether the registration
           number on her profile matches the vehicle she actually owns.
           Making an operator open them one at a time invites approving on
           the first without ever reading the second. -->
      <label>Submitted documents</label>
      <div class="docs">
        <div>
          <div class="doc-label">Identity document</div>
          <div class="doc" id="docBox">
            ${r.documentSubmitted
              ? '<div class="skel doc-skel" aria-label="Loading document"></div>'
              : '<div class="fallback">Nothing uploaded yet.</div>'}
          </div>
        </div>
        ${isCustomer(r) ? '' : `
        <div>
          <div class="doc-label">Vehicle RC
            <span class="doc-hint">must match ${esc(r.vehicleRegistrationNumber || 'the number on file')}</span>
          </div>
          <div class="doc" id="rcBox">
            ${r.documentSubmitted
              ? '<div class="skel doc-skel" aria-label="Loading document"></div>'
              : '<div class="fallback">Nothing uploaded yet.</div>'}
          </div>
        </div>`}
      </div>

      <div class="check">
        <div class="top"><h4>ID &amp; gender check</h4>${badge(r.genderVerificationStatus)}</div>
        <p>Confirm the document is readable and matches the ${isCustomer(r) ? "customer's" : "driver's"} name.</p>
        <div class="row">
          <button class="btn btn-approve" data-decide="gender" data-decision="VERIFIED" type="button">Approve</button>
          <button class="btn btn-reject" data-decide="gender" data-decision="REJECTED" type="button">Reject</button>
        </div>
      </div>

      ${isCustomer(r) ? `
      <div class="check">
        <div class="top"><h4>Police check</h4><span class="badge b-grey">Not required</span></div>
        <p>Customers are not police-verified — only their ID is checked. Approving the ID check above is all this account needs.</p>
      </div>` : `
      <div class="check">
        <div class="top"><h4>Police check</h4>${badge(r.policeVerificationStatus)}</div>
        <p>Record the outcome of the police verification for this driver.</p>
        <div class="row">
          <button class="btn btn-approve" data-decide="police" data-decision="VERIFIED" type="button">Approve</button>
          <button class="btn btn-reject" data-decide="police" data-decision="REJECTED" type="button">Reject</button>
        </div>
      </div>`}
    </div>
    <div class="modal-foot"><button class="btn" data-cancel type="button">Close</button></div>
  `, { wide: true });

  const root = $('modalRoot');
  root.querySelector('[data-cancel]').addEventListener('click', closeModal);

  if (r.documentSubmitted) {
    api(`/admin/verification/${r.accountId}/document`)
      .then(out => {
        renderDocument(root.querySelector('#docBox'), out.url, 'Submitted identity document');
        const rcBox = root.querySelector('#rcBox');
        if (!rcBox) return;
        if (out.rcUrl) {
          renderDocument(rcBox, out.rcUrl, 'Vehicle registration certificate');
        } else {
          // Says which of the two it is. A partner who submitted before the
          // RC was required is a different case from one who skipped it, and
          // an operator deciding whether to chase her needs to know which.
          rcBox.innerHTML = '<div class="fallback">No RC on file. This partner submitted before it was required — ask her to re-submit both documents before approving.</div>';
        }
      })
      .catch(err => {
        if (err.message === 'unauthorized') return;
        ['#docBox', '#rcBox'].forEach(sel => {
          const box = root.querySelector(sel);
          if (box) box.innerHTML = `<div class="fallback">Could not load the document: ${esc(err.message)}</div>`;
        });
      });
  }

  root.querySelectorAll('[data-decide]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const which = btn.dataset.decide;
      const decision = btn.dataset.decision;
      const label = which === 'gender' ? 'ID & gender check' : 'police check';
      const approving = decision === 'VERIFIED';
      const ok = await confirmAction({
        title: approving ? `Approve the ${label}?` : `Reject the ${label}?`,
        message: approving
          ? (isCustomer(r)
              ? `${r.name || r.phoneNumber} will be verified and can start booking. Customers need only this one check.`
              : `${r.name || r.phoneNumber} will pass this check. A driver passes both checks before they can go online.`)
          : (isCustomer(r)
              ? `${r.name || r.phoneNumber} will not be verified and cannot book until it is approved.`
              : `${r.name || r.phoneNumber} will not pass this check and cannot go online until it is approved.`),
        confirmLabel: approving ? 'Approve' : 'Reject',
        tone: approving ? 'approve' : 'reject',
        withReason: !approving && which === 'gender',
      });
      if (!ok) return;
      try {
        // Unchanged from the previous console: driver-verification's own two
        // admin endpoints, called directly.
        const body = which === 'gender' ? { decision, reason: ok.reason } : { decision };
        await api(`/admin/verification/${r.accountId}/${which}-review`, { method: 'POST', body: JSON.stringify(body) });
        closeModal();
        toast('ok', approving ? 'Check approved' : 'Check rejected',
          `${r.name || r.phoneNumber} — ${label}.`);
        render();
      } catch (err) {
        if (err.message === 'unauthorized') return;
        toast('bad', 'Could not save that decision', err.message);
      }
    });
  });
}
