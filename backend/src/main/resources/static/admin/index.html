<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheOut Ops Console</title>
<!--
  Deliberately one dependency-free static file served by the backend itself,
  rather than a fourth React app. No build step, no deploy of its own, and
  being same-origin it sidesteps CORS entirely.

  This is now a real product surface: non-technical operations staff approve
  drivers and answer safety alerts from it daily. So it reads as an admin
  tool - neutral, dense, legible - rather than borrowing the consumer app's
  illustrated style. SheOut's purple and orange appear only on the header,
  the active nav item and primary buttons, which is enough to place it as
  the same product without making an operational console feel playful.

  Every API call, the ADMIN role gate and the auth flow are unchanged from
  the previous version: this was a presentation and structure rebuild.
-->
<style>
  :root {
    /* Brand, used sparingly - header, active nav, primary actions only. */
    --brand: #4A1A9E;
    --brand-dark: #36116F;
    --brand-tint: #F1ECFA;
    --accent: #FCA325;

    /* Everything else is a neutral admin palette. */
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --line: #E3E5EA;
    --line-soft: #EFF1F4;
    --text: #1B1D21;
    --muted: #6B7280;
    --muted-soft: #9AA1AC;

    --amber: #92610A;   --amber-bg: #FDF4E3;  --amber-line: #F2DCAE;
    --green: #12734A;   --green-bg: #E9F6EF;  --green-line: #B6DFC9;
    --red:   #B3251C;   --red-bg:   #FCEDEB;  --red-line:   #F0C2BC;

    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,29,33,.06), 0 4px 12px rgba(27,29,33,.05);
  }
  * { box-sizing: border-box; }
  /* Must beat the class rules below: .login-wrap and .shell both set
     display, which otherwise wins over the browser's [hidden] rule and
     leaves the sign-in pane rendered underneath the signed-in app. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; }
  button { font: inherit; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 18px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--brand); color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 13px; letter-spacing: .02em;
  }
  .brand .mark span { color: var(--accent); }
  .brand .name { font-weight: 700; font-size: 14px; letter-spacing: .01em; }
  .brand .sub { font-size: 11px; color: var(--muted); }

  .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted-soft); font-weight: 700; padding: 10px 10px 6px;
  }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border: 0; background: none; border-radius: 8px;
    color: var(--muted); cursor: pointer; text-align: left; font-weight: 550;
  }
  .nav button:hover { background: var(--bg); color: var(--text); }
  .nav button[aria-current="page"] { background: var(--brand-tint); color: var(--brand); font-weight: 650; }
  .nav button svg { width: 17px; height: 17px; flex: none; }
  .nav .count {
    margin-left: auto; font-size: 11px; font-weight: 700; min-width: 20px; text-align: center;
    padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--muted);
  }
  .nav button[aria-current="page"] .count { background: var(--brand); color: #fff; }

  .me { border-top: 1px solid var(--line-soft); padding: 12px 14px 14px; }
  .me .who { font-size: 12px; color: var(--muted); }
  .me .phone { font-weight: 650; font-size: 13px; word-break: break-all; }
  .me button {
    margin-top: 10px; width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer;
  }
  .me button:hover { border-color: var(--muted-soft); }

  /* ---------- content ---------- */
  .content { padding: 26px 28px 60px; max-width: 1400px; }
  .page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 62ch; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--text); cursor: pointer; font-weight: 550;
  }
  .btn:hover { border-color: var(--muted-soft); }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn-approve { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-approve:hover { filter: brightness(.94); }
  .btn-reject { background: #fff; border-color: var(--red-line); color: var(--red); }
  .btn-reject:hover { background: var(--red-bg); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-head {
    padding: 13px 16px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .card-head h2 { font-size: 13px; font-weight: 700; }
  .card-head .hint { font-size: 12px; color: var(--muted); }
  .scroll { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 700; padding: 10px 14px;
    border-bottom: 1px solid var(--line); white-space: nowrap; background: #FAFBFC;
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th .arrow { opacity: .35; font-size: 10px; }
  th[aria-sort] .arrow { opacity: 1; color: var(--brand); }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: #FAFAFD; }
  .num { font-variant-numeric: tabular-nums; }
  .subtle { color: var(--muted); font-size: 12px; }
  .strong { font-weight: 600; }

  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 650; white-space: nowrap; border: 1px solid;
  }
  .b-amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-line); }
  .b-green { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
  .b-red   { color: var(--red);   background: var(--red-bg);   border-color: var(--red-line); }
  .b-grey  { color: var(--muted); background: var(--bg);       border-color: var(--line); }
  /* Account type, deliberately not in the amber/green/red status palette -
     a role is not a status and must not read like one. */
  .b-role-driver   { color: #1D4ED8; background: #EAF0FE; border-color: #C5D6FB; }
  .b-role-customer { color: var(--brand); background: var(--brand-tint); border-color: #D9CCF3; }

  /* Blocked is neither a role nor one of the three status tones, and must
     not be mistaken for either. Status badges are pale tints; a role badge
     is a pale tint in a different hue. This is the only solid-filled badge
     in the console, so a blocked account is unmistakable at a glance down a
     column of otherwise pale pills. */
  .b-blocked {
    color: #fff; background: #7F1D1D; border-color: #7F1D1D;
    letter-spacing: .02em; text-transform: uppercase; font-size: 10.5px;
  }

  .wait { font-weight: 650; }
  .wait.warn { color: var(--amber); }
  .wait.bad { color: var(--red); }

  /* ---------- filters + pager ---------- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    padding: 13px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .filters .f { display: flex; flex-direction: column; gap: 4px; }
  .filters .f > span { font-size: 11px; font-weight: 650; color: var(--muted); }
  .filters input, .filters select {
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 13px; background: #fff; color: var(--text);
  }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--brand); }
  .filters .f.wide input { min-width: 230px; }
  .filters .spacer { margin-left: auto; }
  .filters .active {
    align-self: center; font-size: 12px; font-weight: 650; color: var(--brand);
  }

  .pager {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-top: 1px solid var(--line-soft); font-size: 13px;
  }
  .pager .count { color: var(--muted); }
  .pager .controls { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .pager button {
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--text); cursor: pointer;
  }
  .pager button:hover:not([disabled]) { border-color: var(--muted-soft); }
  .pager button[disabled] { opacity: .45; cursor: not-allowed; }
  .pager .of { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- states ---------- */
  .state { padding: 44px 20px; text-align: center; color: var(--muted); }
  .state svg { width: 40px; height: 40px; color: var(--muted-soft); margin-bottom: 10px; }
  .state h3 { font-size: 14px; color: var(--text); font-weight: 650; margin-bottom: 3px; }
  .state p { margin: 0; font-size: 13px; }
  .skel { height: 11px; border-radius: 6px; background: linear-gradient(90deg,#EDEFF3 25%,#F6F7F9 37%,#EDEFF3 63%);
          background-size: 400% 100%; animation: sh 1.3s ease infinite; }
  @keyframes sh { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }

  .banner { padding: 11px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; border: 1px solid; }
  .banner-err { background: var(--red-bg); border-color: var(--red-line); color: var(--red); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(27,29,33,.46); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 460px; box-shadow: 0 18px 48px rgba(0,0,0,.22); }
  .modal.wide { max-width: 680px; }
  .modal-head { padding: 18px 20px 0; }
  .modal-head h3 { font-size: 16px; font-weight: 700; }
  .modal-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .modal-body { padding: 16px 20px; max-height: 62vh; overflow-y: auto; }
  .modal-foot { padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line-soft); }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .modal textarea, .modal input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; color: var(--text);
  }
  .modal textarea { min-height: 74px; resize: vertical; }

  .kv { display: grid; grid-template-columns: 132px 1fr; gap: 7px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 550; }

  .check {
    border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 12px;
  }
  .check .top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .check .top h4 { margin: 0; font-size: 13.5px; font-weight: 700; }
  .check p { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  .check .row { display: flex; gap: 8px; flex-wrap: wrap; }

  .doc { margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .doc img { display: block; width: 100%; max-height: 330px; object-fit: contain; background: #fff; }
  .doc .fallback { padding: 16px; font-size: 12.5px; color: var(--muted); }
  .doc .fallback code { word-break: break-all; background: #fff; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); }
  /* Side by side, because the whole point is reading one against the other.
     Stacks on a narrow window rather than squeezing both into unreadable
     columns. */
  .docs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  @media (max-width: 900px) { .docs { grid-template-columns: 1fr; } }
  .doc-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .doc-hint { font-weight: 400; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- support tickets ---------- */
  /* A sidebar count that needs someone now. Red rather than the brand
     purple, because it is not "this is the page you are on" - it is "there
     is a safety or high-priority ticket nobody has resolved". */
  .nav .count.urgent, .nav button[aria-current="page"] .count.urgent { background: var(--red); color: #fff; }
  .banner-info { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber); display: flex; align-items: center; gap: 12px; }
  .banner-info .btn { margin-left: auto; }

  .thread { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .msg { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; max-width: 88%; }
  .msg .who { font-size: 11.5px; font-weight: 650; color: var(--muted); margin-bottom: 2px; display: flex; gap: 8px; align-items: center; }
  .msg .body { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .msg.raiser { align-self: flex-start; background: var(--bg); }
  .msg.staff { align-self: flex-end; background: var(--brand-tint); border-color: #D9CCF3; }
  /* Internal notes must never be mistaken for a reply the rider can read,
     so they look nothing like one: amber, dashed, and labelled. */
  .msg.internal { align-self: stretch; max-width: none; background: var(--amber-bg); border: 1px dashed var(--amber-line); }
  .msg.internal .body { color: #5C3D06; }

  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 700px) { .controls-grid { grid-template-columns: 1fr; } }
  .controls-grid .check { margin-top: 0; }
  .modal select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; color: var(--text); margin-bottom: 8px;
  }
  .modal .toggle { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 12.5px; color: var(--text); font-weight: 550; }
  .modal .toggle input { width: auto; margin: 0; }
  .reply-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .reply-row .hint { font-size: 12px; color: var(--muted); }
  .reply-row .btn { margin-left: auto; }
  .sos-link { border: 1px solid var(--red-line); background: var(--red-bg); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 12.5px; color: var(--red); }

  /* ---------- content ---------- */
  /* One cell holds the whole editor: the card and its filters are reused, the table rows are not. */
  .content-cell { padding: 0; }
  .content-wrap { padding: 4px 16px 16px; }
  .content-group { margin-top: 18px; }
  .content-group > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
  .cb { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .cb.dirty { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  .cb .where { font-weight: 600; font-size: 13px; }
  .cb .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted-soft); }
  .cb textarea {
    width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 13.5px; line-height: 1.5; resize: vertical; min-height: 40px; color: var(--text);
  }
  .cb textarea:focus { outline: none; border-color: var(--brand); }
  .cb .foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .cb .foot .meta { font-size: 12px; color: var(--muted); }
  .cb .foot .chars { font-size: 11.5px; color: var(--muted-soft); margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ---------- toasts ---------- */
  .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: flex; flex-direction: column; gap: 9px; max-width: 380px; }
  .toast {
    padding: 12px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16);
    font-size: 13px; display: flex; gap: 10px; align-items: flex-start; background: #fff; border-left: 4px solid var(--muted);
    animation: rise .18s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } }
  .toast.ok { border-left-color: var(--green); }
  .toast.bad { border-left-color: var(--red); }
  .toast strong { display: block; font-size: 13px; }
  .toast span { color: var(--muted); font-size: 12.5px; }

  /* ---------- login ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 22px; }
  .login { width: 100%; max-width: 380px; }
  .login .card { padding: 26px; }
  .login .brand { border: 0; padding: 0 0 18px; }
  .login h2 { font-size: 17px; font-weight: 700; }
  .login p.lead { margin: 5px 0 18px; color: var(--muted); font-size: 13px; }
  .login label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .login .btn { width: 100%; margin-top: 16px; padding: 11px; }

  /* Phone entry, mirroring the apps' PhoneField: a fixed +91 chip outside
     the input, and ten digits inside it. */
  .phone-field { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .phone-field:focus-within { border-color: var(--brand); }
  .phone-field .cc {
    display: flex; align-items: center; padding: 0 11px; font-size: 13px; font-weight: 650;
    color: var(--text); background: var(--bg); border-right: 1px solid var(--line);
  }
  .phone-field input { border: 0; border-radius: 0; letter-spacing: .5px; }
  .phone-field input:focus { outline: none; }
  .phone-field.bad { border-color: var(--red); }
  .field-err { margin: 6px 0 0; font-size: 12px; color: var(--red); }

  /* ---------- responsive: tablet and below ---------- */
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: column; border-right: 0; border-bottom: 1px solid var(--line); }
    .nav { flex-direction: row; overflow-x: auto; padding: 8px 10px; gap: 6px; }
    .nav .label { display: none; }
    .nav button { width: auto; white-space: nowrap; }
    .me { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line-soft); }
    .me .who-wrap { flex: 1; min-width: 0; }
    .me button { width: auto; margin-top: 0; flex: none; }
    .content { padding: 20px 16px 48px; }
    .kv { grid-template-columns: 1fr; gap: 2px 0; }
    .kv dt { margin-top: 8px; }
  }
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div class="login-wrap" id="loginWrap">
  <div class="login">
    <div class="card">
      <div class="brand">
        <div class="mark">S<span>O</span></div>
        <div>
          <div class="name">SheOut Ops Console</div>
          <div class="sub">Operations team access</div>
        </div>
      </div>
      <h2>Sign in</h2>
      <p class="lead">Use the mobile number registered to your operations account. We'll send a one-time code.</p>
      <div class="banner banner-err" id="loginErr" hidden></div>
      <form id="login">
        <label for="phone">Mobile number</label>
        <!-- Same rules as PhoneField in the shared design system, which this
             page cannot import: it is a dependency-free static file with no
             build step and no React. A fixed +91 chip outside the field,
             ten digits inside it, non-digits rejected as they are typed.
             Before this it was one free-text box that took a country code,
             a name, any length of anything - so the same operator saw three
             different phone fields across the product. -->
        <div class="phone-field" id="phoneWrap">
          <span class="cc">+91</span>
          <input id="phone" inputmode="numeric" placeholder="9000000042"
                 autocomplete="tel-national" aria-describedby="phoneErr" required>
        </div>
        <p class="field-err" id="phoneErr" hidden>Enter the 10 digits of your mobile number.</p>
        <div id="codeRow" hidden>
          <label for="code">One-time code</label>
          <input id="code" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code">
        </div>
        <button class="btn btn-primary" id="loginBtn" type="submit">Send code</button>
      </form>
    </div>
  </div>
</div>

<!-- ============================== APP ============================== -->
<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="mark">S<span>O</span></div>
      <div>
        <div class="name">SheOut Ops</div>
        <div class="sub">Console</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="label">Operations</div>
      <button data-tab="queue" aria-current="page">

<script>
const API = '/api/v1';
let token = localStorage.getItem('sheout.admin.token') || '';
let tab = 'queue';
let sort = { key: null, dir: 'asc' };
let lastRows = [];

const $ = id => document.getElementById(id);
/**
 * Escapes for HTML. Single quotes and backticks are in the set on purpose:
 * without them a value placed inside a single-quoted attribute, or inside a
 * JS string built into markup, can close its own delimiter and run. There
 * was exactly one such site here (the document image's onerror handler),
 * and it was safe only because an upload filename is sanitised to
 * [A-Za-z0-9._-] two modules away - a guarantee this file cannot see and
 * should not be relying on.
 */
const esc = v => (v === null || v === undefined || v === '')
  ? '—'
  : String(v).replace(/[&<>"'`]/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;',
    }[c]));
const time = v => v ? new Date(v).toLocaleString() : '—';

/**
 * Plain language for the raw enum values. Operations staff should never
 * have to learn that UNDER_REVIEW means "someone needs to look at this".
 */
const STATUS_TEXT = {
  UNDER_REVIEW: 'Awaiting review', PENDING: 'Not yet submitted',
  VERIFIED: 'Approved', REJECTED: 'Rejected',
  REQUESTED: 'Requested', MATCHED: 'Driver matched', ACCEPTED: 'Accepted',
  IN_PROGRESS: 'In progress', COMPLETED: 'Completed', CANCELLED: 'Cancelled',
  // Not 'Cancelled'. Nobody cancelled this one - the search ran out and
  // found nobody, which is a supply problem to act on, not a rider
  // changing her mind. Collapsing the two would hide exactly the number an
  // operator needs to see.
  NO_DRIVERS_AVAILABLE: 'No drivers found',
  CAPTURED: 'Paid', FAILED: 'Failed', REFUNDED: 'Refunded', RESOLVED: 'Resolved',
  // Support tickets. IN_PROGRESS and RESOLVED already read correctly above.
  OPEN: 'Open', CLOSED: 'Closed',
};
const STATUS_TONE = {
  UNDER_REVIEW: 'amber', PENDING: 'amber', REQUESTED: 'amber', MATCHED: 'amber',
  ACCEPTED: 'amber', IN_PROGRESS: 'amber',
  VERIFIED: 'green', COMPLETED: 'green', CAPTURED: 'green', RESOLVED: 'green',
  REJECTED: 'red', FAILED: 'red', CANCELLED: 'red', REFUNDED: 'red',
  // Amber, not red: this is the platform falling short, not misconduct.
  NO_DRIVERS_AVAILABLE: 'amber',
  OPEN: 'amber', CLOSED: 'grey',
};
const TICKET_CATEGORY_TEXT = {
  SAFETY_CONCERN: 'Safety concern', PAYMENT_DISPUTE: 'Payment dispute',
  DRIVER_OR_CUSTOMER_BEHAVIOR: 'Behaviour', CANCELLATION_DISPUTE: 'Cancellation dispute',
  APP_ISSUE: 'App issue', OTHER: 'Other',
};
const PRIORITY_TEXT = { HIGH: 'High', MEDIUM: 'Medium', LOW: 'Low' };
const ticketCategoryText = v => TICKET_CATEGORY_TEXT[v] || humanize(v);
function priorityBadge(p) {
  const tone = p === 'HIGH' ? 'b-red' : p === 'MEDIUM' ? 'b-amber' : 'b-grey';
  return `<span class="badge ${tone}">${esc(PRIORITY_TEXT[p] || humanize(p))}</span>`;
}
/**
 * The same treatment for the other enums the API returns. Status had this
 * already, but the Bookings table printed the service as "PARCEL" over
 * "DELIVERY" and the payment method as "CASH", which is the API's
 * vocabulary rather than an operator's - and it sat one column away from a
 * status that was written out properly, so the row read as half-finished.
 */
const SERVICE_TEXT = {
  BIKE: 'Bike Taxi', AUTO: 'Auto Ride', CAB: 'Cab Ride',
  PARCEL: 'Parcel Delivery', LUNCHBOX: 'Lunch Box Delivery',
};
const TRIP_TYPE_TEXT = { RIDE: 'Ride', DELIVERY: 'Delivery' };
const PAY_METHOD_TEXT = { UPI: 'UPI', CASH: 'Cash' };

/** Any unmapped value degrades to sentence case rather than shouting. */
function humanize(v) {
  if (!v) return '';
  const s = String(v).replace(/_/g, ' ').toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const serviceText = v => SERVICE_TEXT[v] || humanize(v);
const tripTypeText = v => TRIP_TYPE_TEXT[v] || humanize(v);
const payMethodText = v => PAY_METHOD_TEXT[v] || humanize(v);

/**
 * A customer only ever needs the ID/gender check - the police column is
 * null for every CUSTOMER record, so showing it as a status would invent a
 * check that does not apply to them.
 */
function isCustomer(r) { return r && r.role === 'CUSTOMER'; }

function roleBadge(role) {
  if (role === 'CUSTOMER') return '<span class="badge b-role-customer">Customer</span>';
  if (role === 'DRIVER') return '<span class="badge b-role-driver">Driver</span>';
  return `<span class="badge b-grey">${esc(role || 'Unknown')}</span>`;
}

function badge(v) {
  if (!v) return '<span class="badge b-grey">—</span>';
  return `<span class="badge b-${STATUS_TONE[v] || 'grey'}">${esc(STATUS_TEXT[v] || v)}</span>`;
}

/** "3 days" / "4 hours" / "12 minutes", plus a tone once it has been too long. */
function waited(iso) {
  if (!iso) return { text: '—', cls: '' };
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  const text = mins < 60 ? `${mins} min`
    : mins < 1440 ? `${Math.round(mins / 60)} hr`
    : `${Math.round(mins / 1440)} d`;
  const cls = mins >= 2880 ? 'bad' : mins >= 1440 ? 'warn' : '';
  return { text, cls, mins };
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(options.headers || {})
    }
  });
  if (res.status === 401 || res.status === 403) {
    // 403 here means "not an ADMIN" - a role gate, genuinely distinct from
    // the 404 the per-resource checks return.
    signOut('Your session is not authorised as an operations account. Sign in with an admin account.');
    throw new Error('unauthorized');
  }
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.message) || `Request failed (${res.status})`);
  return body;
}

// ---- toasts ---------------------------------------------------------------
function toast(kind, title, detail) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'ok' ? 'ok' : 'bad');
  el.innerHTML = `<div><strong>${esc(title)}</strong>${detail ? `<span>${esc(detail)}</span>` : ''}</div>`;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; setTimeout(() => el.remove(), 220); }, 4200);
}

// ---- modal ----------------------------------------------------------------
function closeModal() { $('modalRoot').innerHTML = ''; document.body.style.overflow = ''; }
function openModal(html, opts = {}) {
  document.body.style.overflow = 'hidden';
  $('modalRoot').innerHTML = `<div class="overlay" data-overlay><div class="modal ${opts.wide ? 'wide' : ''}">${html}</div></div>`;
  $('modalRoot').querySelector('[data-overlay]').addEventListener('click', e => {
    if (e.target.hasAttribute('data-overlay')) closeModal();
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/**
 * Every irreversible action goes through this. Approving or rejecting a
 * driver, or resolving a safety alert, has real consequences and an ops
 * person who clicked the wrong row deserves the chance to catch it.
 */
function confirmAction({
  title,
  message,
  confirmLabel,
  tone = 'primary',
  withReason = false,
  /** Blocking needs one; rejecting a document does not. */
  reasonRequired = false,
  reasonLabel = 'Reason (optional, shared with the driver)',
  reasonPlaceholder = 'e.g. Document is blurred and the name cannot be read',
}) {
  return new Promise(resolve => {
    openModal(`
      <div class="modal-head"><h3>${esc(title)}</h3><p>${esc(message)}</p></div>
      <div class="modal-body">
        ${withReason ? `<label for="reasonInput">${esc(reasonLabel)}</label>
        <textarea id="reasonInput" placeholder="${esc(reasonPlaceholder)}"></textarea>
        <p class="field-err" id="reasonErr" hidden>Please say why. This is kept as the record of the decision.</p>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn" data-cancel type="button">Cancel</button>
        <button class="btn ${tone === 'approve' ? 'btn-approve' : tone === 'reject' ? 'btn-reject' : 'btn-primary'}" data-go type="button">${esc(confirmLabel)}</button>
      </div>`);
    const root = $('modalRoot');
    root.querySelector('[data-cancel]').addEventListener('click', () => { closeModal(); resolve(null); });
    root.querySelector('[data-go]').addEventListener('click', () => {
      const box = withReason ? root.querySelector('#reasonInput') : null;
      const reason = box ? box.value.trim() : '';
      // Refused here as well as by the API. The server is the rule, but
      // finding out after the dialog closed would lose what was typed.
      if (reasonRequired && !reason) {
        root.querySelector('#reasonErr').hidden = false;
        box.focus();
        return;
      }
      closeModal();
      resolve({ reason: reason || null });
    });
  });
}

// ---- login ----------------------------------------------------------------
let awaitingCode = false;

// Mirrors normalizeDigits/isCompletePhone in the design system's PhoneField.
const PHONE_DIGITS = 10;
const cleanPhone = raw => String(raw).replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '').slice(0, PHONE_DIGITS);

// Rejected as typed, not only on submit - a field that silently accepts a
// letter and then complains later reads as broken.
$('phone').addEventListener('input', e => {
  const cleaned = cleanPhone(e.target.value);
  if (e.target.value !== cleaned) e.target.value = cleaned;
  if (cleaned.length === PHONE_DIGITS) showPhoneError(false);
});

function showPhoneError(show) {
  $('phoneWrap').classList.toggle('bad', show);
  $('phoneErr').hidden = !show;
}

// Same six-digit numeric-only treatment the two apps give their OTP box.
$('code').addEventListener('input', e => {
  const cleaned = String(e.target.value).replace(/\D/g, '').slice(0, 6);
  if (e.target.value !== cleaned) e.target.value = cleaned;
});

$('login').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').hidden = true;
  const digits = cleanPhone($('phone').value);
  if (digits.length !== PHONE_DIGITS) {
    showPhoneError(true);
    $('phone').focus();
    return;
  }
  showPhoneError(false);
  const phoneNumber = '+91' + digits;
  try {
    if (!awaitingCode) {
      await api('/auth/otp/request', { method: 'POST', body: JSON.stringify({ phoneNumber, role: 'ADMIN' }) });
      awaitingCode = true;
      $('codeRow').hidden = false;
      $('loginBtn').textContent = 'Sign in';
      $('code').focus();
      return;
    }
    const out = await api('/auth/otp/verify', {
      method: 'POST',
      body: JSON.stringify({ phoneNumber, code: $('code').value.trim(), role: 'ADMIN' })
    });
    token = out.accessToken;
    localStorage.setItem('sheout.admin.token', token);
    localStorage.setItem('sheout.admin.phone', phoneNumber);
    start();
  } catch (err) {
    if (err.message === 'unauthorized') return;
    $('loginErr').textContent = err.message;
    $('loginErr').hidden = false;
  }
});

function signOut(message) {
  token = '';
  localStorage.removeItem('sheout.admin.token');
  awaitingCode = false;
  $('codeRow').hidden = true;
  $('code').value = '';
  showPhoneError(false);
  $('loginBtn').textContent = 'Send code';
  $('app').hidden = true;
  $('loginWrap').hidden = false;
  closeModal();
  if (message) { $('loginErr').textContent = message; $('loginErr').hidden = false; }
}
$('logout').addEventListener('click', async () => {
  const ok = await confirmAction({
    title: 'Log out of the ops console?',
    message: 'You will need your mobile number and a one-time code to sign back in.',
    confirmLabel: 'Log out',
  });
  if (ok) signOut(null);
});

// ---- views ----------------------------------------------------------------
const ICON_EMPTY_QUEUE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>';
const ICON_EMPTY_SOS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_EMPTY_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';

const ICON_EMPTY_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8 11h6"/></svg>';
const ICON_EMPTY_PEOPLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>';

/** Rows per page. Dense table on a wide screen, so more than a phone list. */
const PAGE_SIZE = 25;

/**
 * Filter and page state, kept per section.
 *
 * Per section rather than one shared object: switching from Bookings to
 * Accounts and back should not silently carry a status filter across, and a
 * date range that means something in one table means nothing in the other.
 */
const filterState = {};

function stateFor(name) {
  if (!filterState[name]) filterState[name] = { page: 0 };
  return filterState[name];
}

/**
 * Turns the current filter state into a query string.
 *
 * A blank filter is omitted entirely, not sent empty: the backend cannot
 * parse `status=` into an enum, while an absent `status` correctly means
 * "do not narrow". Dates are widened to the whole local day - a "to" of
 * today means through the end of today, and the off-by-one there hides a
 * day's worth of rows.
 */
function filterQuery(state, extra = {}) {
  const params = new URLSearchParams();
  for (const [key, value] of Object.entries({ ...state, ...extra })) {
    if (value === '' || value === null || value === undefined) continue;
    if (key === 'from') params.set('from', new Date(`${value}T00:00:00`).toISOString());
    else if (key === 'to') params.set('to', new Date(`${value}T23:59:59.999`).toISOString());
    else params.set(key, String(value));
  }
  const query = params.toString();
  return query ? `?${query}` : '';
}

/** How many filters are narrowing the list. page is not a filter. */
function activeFilterCount(view, state) {
  if (!view.filters) return 0;
  return view.filters.filter(f => state[f.key] !== undefined && state[f.key] !== '').length;
}

function paintFilters(view) {
  const host = $('filters');
  if (!view.filters) { host.hidden = true; host.innerHTML = ''; return; }
  const state = stateFor(tab);
  const count = activeFilterCount(view, state);
  host.hidden = false;
  host.innerHTML = view.filters.map(f => {
    const value = state[f.key] ?? '';
    if (f.kind === 'text') {
      return `<label class="f ${f.wide ? 'wide' : ''}"><span>${esc(f.label)}</span>
        <input type="search" data-filter="${esc(f.key)}" placeholder="${esc(f.placeholder || '')}" value="${esc(value === '' ? '' : value)}"></label>`;
    }
    if (f.kind === 'date') {
      return `<label class="f"><span>${esc(f.label)}</span>
        <input type="date" data-filter="${esc(f.key)}" value="${esc(value === '' ? '' : value)}"></label>`;
    }
    const options = f.options().map(o =>
      `<option value="${esc(o.value)}"${String(value) === String(o.value) ? ' selected' : ''}>${esc(o.label)}</option>`).join('');
    return `<label class="f"><span>${esc(f.label)}</span>
      <select data-filter="${esc(f.key)}"><option value="">${esc(f.any)}</option>${options}</select></label>`;
  }).join('')
    + (count > 0
      ? `<span class="spacer"></span><span class="active">${count} filter${count === 1 ? '' : 's'} applied</span>
         <button class="btn" data-clear-filters type="button">Clear filters</button>`
      : '');

  // The value is re-read from the DOM on every change rather than tracked
  // per keystroke, and a text box waits before reloading so typing an
  // address does not fire a request per letter.
  host.querySelectorAll('[data-filter]').forEach(el => {
    const commit = () => {
      const s = stateFor(tab);
      s[el.dataset.filter] = el.value;
      s.page = 0;
      render({ keepFocus: el.dataset.filter });
    };
    if (el.type === 'search') {
      let timer;
      el.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(commit, 400); });
    } else {
      el.addEventListener('change', commit);
    }
  });
  const clear = host.querySelector('[data-clear-filters]');
  if (clear) clear.addEventListener('click', () => { filterState[tab] = { page: 0 }; render(); });
}

function paintPager(paged) {
  const host = $('pager');
  if (!paged) { host.hidden = true; host.innerHTML = ''; return; }
  const { page, totalItems, totalPages, hasMore } = paged;
  if (totalItems === 0) { host.hidden = true; host.innerHTML = ''; return; }
  const first = page * paged.pageSize + 1;
  const last = first + paged.items.length - 1;
  host.hidden = false;
  // Numbered pages rather than load-more, unlike the phone screens: an
  // operator scanning a dense grid on a wide screen wants to jump, and
  // knowing there are four pages is itself information.
  host.innerHTML = `
    <span class="count">Showing <strong>${first}–${last}</strong> of <strong>${totalItems}</strong></span>
    <span class="controls">
      <button data-page="0" type="button" ${page === 0 ? 'disabled' : ''}>First</button>
      <button data-page="${page - 1}" type="button" ${page === 0 ? 'disabled' : ''}>Previous</button>
      <span class="of">Page ${page + 1} of ${Math.max(totalPages, 1)}</span>
      <button data-page="${page + 1}" type="button" ${hasMore ? '' : 'disabled'}>Next</button>
      <button data-page="${Math.max(totalPages - 1, 0)}" type="button" ${hasMore ? '' : 'disabled'}>Last</button>
    </span>`;
  host.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => {
    stateFor(tab).page = Math.max(Number(b.dataset.page), 0);
    render();
  }));
}

const VIEWS = {
  queue: {
    title: 'Verification Queue',
    desc: 'Everyone who has submitted a document and is waiting for a decision - drivers and customers both. Every approval here is a human decision; nothing is checked automatically.',
    cardTitle: 'Awaiting review',
    hint: 'Select a row to see the document and decide',
    empty: { icon: ICON_EMPTY_QUEUE, title: 'Nobody awaiting review', text: 'When a driver or customer submits a document they will appear here.' },
    columns: [
      { key: 'role', label: 'Account type', sort: r => r.role || '' },
      { key: 'name', label: 'Name', sort: r => (r.name || '').toLowerCase() },
      { key: 'phoneNumber', label: 'Phone', sort: r => r.phoneNumber || '' },
      { key: 'gender', label: 'ID & gender check', sort: r => r.genderVerificationStatus || '' },
      { key: 'police', label: 'Police check', sort: r => r.policeVerificationStatus || '' },
      { key: 'submitted', label: 'Submitted', sort: r => new Date(r.updatedAt || 0).getTime() },
      { key: 'waiting', label: 'Waiting', sort: r => -new Date(r.updatedAt || 0).getTime() },
      { key: 'doc', label: 'Document', sort: r => (r.documentSubmitted ? 0 : 1) },
    ],
    load: () => api('/admin/verification/review-queue'),
    cell: (r, key) => {
      if (key === 'role') return roleBadge(r.role);
      if (key === 'name') return `<span class="strong">${esc(r.name || 'Name not set')}</span>${r.blocked ? ' <span class="badge b-blocked">Blocked</span>' : ''}`;
      if (key === 'phoneNumber') return `<span class="num">${esc(r.phoneNumber)}</span>`;
      if (key === 'gender') return badge(r.genderVerificationStatus);
      if (key === 'police') return isCustomer(r)
        ? '<span class="subtle">Not required</span>'
        : badge(r.policeVerificationStatus);
      if (key === 'submitted') return `<span class="subtle">${time(r.updatedAt)}</span>`;
      if (key === 'waiting') { const w = waited(r.updatedAt); return `<span class="wait ${w.cls}">${w.text}</span>`; }
      if (key === 'doc') return r.documentSubmitted
        ? '<span class="badge b-green">Submitted</span>'
        : '<span class="badge b-grey">None</span>';
      return '—';

/**
 * A cancellation rate, with the counts it came from.
 *
 * Both halves, always. A bare "50%" is unreadable without knowing whether
 * it is one trip out of two or four hundred out of eight hundred, and an
 * operator about to remove somebody's access should never have to guess
 * which. The colour is a hint, not a verdict.
 */
function rateCell(stats) {
  if (!stats || !stats.totalBookings) {
    return '<span class="subtle">No trips yet</span>';
  }
  const percent = Math.round((stats.totalCancellations / stats.totalBookings) * 100);
  const tone = percent >= 40 ? 'b-red' : percent >= 20 ? 'b-amber' : 'b-green';
  return `<span class="badge ${tone}">${percent}%</span>
    <div class="subtle num">${stats.totalCancellations} of ${stats.totalBookings} trips</div>`;
}

/**
 * An average rating, with how many opinions it is made of.
 *
 * "Not rated yet" is not a score, and must never render as 0.0 or as a red
 * badge. A partner nobody has rated would otherwise sort and read as the
 * worst person on the platform on the strength of no evidence at all.
 *
 * The count is shown for the same reason the cancellation cell shows its
 * denominator: 2.0 from two riders on a bad night and 2.0 from forty are
 * different facts, and an operator deciding whether to remove somebody's
 * livelihood should not have to guess which one they are looking at.
 */
function ratingCell(stats) {
  if (!stats || !stats.totalRatings || stats.averageStars == null) {
    return '<span class="subtle">Not rated yet</span>';
  }
  const average = Number(stats.averageStars);
  const tone = average < 3.5 ? 'b-red' : average < 4.2 ? 'b-amber' : 'b-green';
  return `<span class="badge ${tone}">★ ${average.toFixed(2)}</span>
    <div class="subtle num">${stats.totalRatings} rating${stats.totalRatings === 1 ? '' : 's'}</div>`;
}

// ---- driver detail + decisions -------------------------------------------
/**
 * The two checks are approved or rejected separately because the backend
 * exposes them as two endpoints and they are genuinely two decisions - an ID
 * can be fine while a police record is still outstanding.
 */
/**
 * Draws one stored document into a box, whatever the storage backend hands
 * back.
 *
 * Extracted so both documents render identically. It used to be inline for
 * the single document, and duplicating it for the second would have meant
 * two copies of the escaping rules below - which is exactly the kind of
 * thing that stays right in one copy and drifts in the other.
 *
 * Built with DOM calls and a real listener rather than an onerror attribute
 * containing a JS string containing more markup. That nesting meant the
 * document URL had to survive three escaping contexts at once, and any one
 * of them getting it wrong would run whatever the URL said inside a
 * signed-in admin's session. Nothing is interpolated into markup here.
 */
function renderDocument(box, url, alt) {
  if (!box) return;
  // Local deployments store documents on disk and hand back a file:// URL,
  // which a browser will not render from a page. Show the image when it can
  // be shown and the path when it cannot, rather than an empty frame that
  // looks broken.
  if (String(url || '').startsWith('file:')) {
    box.innerHTML = `<div class="fallback">Stored on the server's local disk, which a browser cannot display directly.<br><code>${esc(url)}</code></div>`;
    return;
  }
  box.textContent = '';
  const img = document.createElement('img');
  img.alt = alt;
  img.addEventListener('error', () => {
    const fallback = document.createElement('div');
    fallback.className = 'fallback';
    fallback.append('Could not load this image. ');
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noreferrer';
    link.textContent = 'Open it directly';
    fallback.append(link, '.');
    box.textContent = '';
    box.append(fallback);
  });
  img.src = url;
  box.append(img);
}

      ${isCustomer(r) ? `
      <div class="check">
        <div class="top"><h4>Police check</h4><span class="badge b-grey">Not required</span></div>
        <p>Customers are not police-verified — only their ID is checked. Approving the ID check above is all this account needs.</p>
      </div>` : `
      <div class="check">
        <div class="top"><h4>Police check</h4>${badge(r.policeVerificationStatus)}</div>
        <p>Record the outcome of the police verification for this driver.</p>
        <div class="row">
          <button class="btn btn-approve" data-decide="police" data-decision="VERIFIED" type="button">Approve</button>
          <button class="btn btn-reject" data-decide="police" data-decision="REJECTED" type="button">Reject</button>
        </div>
      </div>`}
    </div>
    <div class="modal-foot"><button class="btn" data-cancel type="button">Close</button></div>
  `, { wide: true });

  const root = $('modalRoot');
  root.querySelector('[data-cancel]').addEventListener('click', closeModal);

  if (r.documentSubmitted) {
    api(`/admin/verification/${r.accountId}/document`)
      .then(out => {
        renderDocument(root.querySelector('#docBox'), out.url, 'Submitted identity document');
        const rcBox = root.querySelector('#rcBox');
        if (!rcBox) return;
        if (out.rcUrl) {
          renderDocument(rcBox, out.rcUrl, 'Vehicle registration certificate');
        } else {
          // Says which of the two it is. A partner who submitted before the
          // RC was required is a different case from one who skipped it, and
          // an operator deciding whether to chase her needs to know which.
          rcBox.innerHTML = '<div class="fallback">No RC on file. This partner submitted before it was required — ask her to re-submit both documents before approving.</div>';
        }
      })
      .catch(err => {
        if (err.message === 'unauthorized') return;
        ['#docBox', '#rcBox'].forEach(sel => {
          const box = root.querySelector(sel);
          if (box) box.innerHTML = `<div class="fallback">Could not load the document: ${esc(err.message)}</div>`;
        });
      });
  }

  root.querySelectorAll('[data-decide]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const which = btn.dataset.decide;
      const decision = btn.dataset.decision;
      const label = which === 'gender' ? 'ID & gender check' : 'police check';
      const approving = decision === 'VERIFIED';
      const ok = await confirmAction({
        title: approving ? `Approve the ${label}?` : `Reject the ${label}?`,
        message: approving
          ? (isCustomer(r)
              ? `${r.name || r.phoneNumber} will be verified and can start booking. Customers need only this one check.`
              : `${r.name || r.phoneNumber} will pass this check. A driver passes both checks before they can go online.`)
          : (isCustomer(r)
              ? `${r.name || r.phoneNumber} will not be verified and cannot book until it is approved.`
              : `${r.name || r.phoneNumber} will not pass this check and cannot go online until it is approved.`),
        confirmLabel: approving ? 'Approve' : 'Reject',
        tone: approving ? 'approve' : 'reject',
        withReason: !approving && which === 'gender',
      });
      if (!ok) return;
      try {
        // Unchanged from the previous console: driver-verification's own two
        // admin endpoints, called directly.
        const body = which === 'gender' ? { decision, reason: ok.reason } : { decision };
        await api(`/admin/verification/${r.accountId}/${which}-review`, { method: 'POST', body: JSON.stringify(body) });
        closeModal();
        toast('ok', approving ? 'Check approved' : 'Check rejected',
          `${r.name || r.phoneNumber} — ${label}.`);
        render();
      } catch (err) {
        if (err.message === 'unauthorized') return;
        toast('bad', 'Could not save that decision', err.message);
      }
    });
  });
}

// ---- support tickets ------------------------------------------------------
/**
 * The moves the server allows from each status (SupportTicketStatus.canMoveTo).
 * Mirrored here only to offer sensible choices - the server is the rule and
 * refuses anything else regardless.
 */
const TICKET_NEXT = {
  OPEN: ['IN_PROGRESS', 'RESOLVED', 'CLOSED'],
  IN_PROGRESS: ['OPEN', 'RESOLVED', 'CLOSED'],
  RESOLVED: ['IN_PROGRESS', 'OPEN', 'CLOSED'],
  CLOSED: [],
};

let operatorsCache = null;
async function operators() {
  if (!operatorsCache) operatorsCache = await api('/admin/support/operators');
  return operatorsCache;
}

/**
 * The sidebar's alert for tickets, and the SOS page's link to them.
 *
 * Read on every render rather than only when the Tickets tab is open: this
 * badge is how an operator on any other page finds out a ticket is waiting,
 * which is the same way the verification queue already surfaces new work.
 * Red when any unresolved ticket is High priority.
 */
async function refreshSupportCounts() {
  try {
    const c = await api('/admin/support/counts');
    const el = $('cSupport');
    el.textContent = c.unresolved;
    el.classList.toggle('urgent', c.unresolvedHigh > 0);
    el.title = c.unresolvedHigh > 0
      ? `${c.unresolved} unresolved, ${c.unresolvedHigh} high priority`
      : `${c.unresolved} unresolved`;
    return c;
  } catch (err) {
    return null;
  }
}

function paintCrossLink(counts) {
  const host = $('crossLink');
  if (tab !== 'sos' || !counts || counts.unresolvedSafety === 0) { host.hidden = true; host.innerHTML = ''; return; }
  const n = counts.unresolvedSafety;
  host.innerHTML = `<span><strong>${n} unresolved safety ticket${n === 1 ? '' : 's'}.</strong>
    These are reports, not live alerts — but read them alongside the alerts below.</span>
    <button class="btn" type="button" data-open-safety>View safety tickets</button>`;
  host.hidden = false;
  host.querySelector('[data-open-safety]').addEventListener('click', () => switchTab('support', { page: 0, category: 'SAFETY_CONCERN' }));
}

function ticketMessage(m) {
  const kind = m.internalOnly ? 'internal' : m.authorRole === 'ADMIN' ? 'staff' : 'raiser';
  const label = m.internalOnly
    ? `<span class="badge b-amber">Internal note</span> ${esc(m.authorLabel)} · operators only`
    : m.authorRole === 'ADMIN' ? `${esc(m.authorLabel)} · reply` : esc(m.authorLabel);
  return `<div class="msg ${kind}"><div class="who">${label}<span class="subtle">${time(m.createdAt)}</span></div>
    <div class="body">${esc(m.message)}</div></div>`;
}

/**
 * One ticket: the facts, anything linked, the thread, and the actions.
 *
 * Replying is not confirmed - it is the ordinary work of the screen and a
 * confirmation on every message would be clicked through unread. Status and
 * assignment are, like every other consequential action in this console.
 * confirmAction replaces this modal while it asks, so the ticket is reopened
 * afterwards, with anything half-typed in the reply box put back.
 */
async function openTicket(id, keep = {}) {
  openModal(`<div class="modal-body"><div class="state"><h3>Loading ticket…</h3></div></div>`, { wide: true });
  let d, ops;
  try {
    [d, ops] = await Promise.all([api(`/admin/support/tickets/${id}`), operators()]);
  } catch (err) {
    if (err.message === 'unauthorized') return;
    openModal(`<div class="modal-body"><div class="state"><h3>Could not load this ticket</h3><p>${esc(err.message)}</p></div></div>
      <div class="modal-foot"><button class="btn" data-cancel type="button">Close</button></div>`, { wide: true });
    $('modalRoot').querySelector('[data-cancel]').addEventListener('click', closeModal);
    return;
  }
  const t = d.ticket;
  const who = t.raisedByName || t.raisedByPhone || 'this person';
  const raiserWord = t.role === 'DRIVER' ? 'partner' : 'rider';
  const closed = t.status === 'CLOSED';
  const b = d.linkedBooking;

  openModal(`
    <div class="modal-head">
      <h3>${esc(t.subject)}</h3>
      <p>${priorityBadge(t.priority)} ${badge(t.status)} &middot; ${esc(ticketCategoryText(t.category))} &middot; raised ${time(t.createdAt)}</p>
    </div>
    <div class="modal-body">
      <dl class="kv">
        <dt>Raised by</dt><dd>${roleBadge(t.role)} ${esc(t.raisedByName || 'Name not set')} <span class="subtle num">${esc(t.raisedByPhone)}</span>${t.raisedByBlocked ? ' <span class="badge b-blocked">Blocked</span>' : ''}</dd>
        <dt>Assigned to</dt><dd>${t.assignedAdminPhone ? `<span class="num">${esc(t.assignedAdminPhone)}</span>` : '<span class="subtle">Unassigned</span>'}</dd>
        <dt>Last update</dt><dd>${time(t.lastActivityAt)}</dd>
        ${t.resolvedAt ? `<dt>Resolved</dt><dd>${time(t.resolvedAt)}${t.resolvedByPhone ? ` by <span class="num">${esc(t.resolvedByPhone)}</span>` : ''}</dd>` : ''}
        <dt>Linked trip</dt><dd>${b
          ? `${esc(serviceText(b.category))} · ${badge(b.status)}<div class="subtle">${esc(b.pickupLabel)} → ${esc(b.dropLabel)} · ${time(b.requestedAt)}</div>
             <div class="subtle">Rider: ${esc(b.customerName || 'Name not set')} · Partner: ${esc(b.driverName || 'Not assigned')}</div>`
          : t.linkedBookingId ? '<span class="subtle">Trip no longer found</span>' : '<span class="subtle">Not about a specific trip</span>'}</dd>
      </dl>
      ${d.sosAlerts.length ? `<div class="sos-link"><strong>SOS was raised on this trip ${d.sosAlerts.length === 1 ? 'once' : d.sosAlerts.length + ' times'}.</strong>
        ${d.sosAlerts.map(a => `<div>${time(a.createdAt)} · ${a.status === 'ACTIVE' ? '<strong>still active</strong>' : 'resolved ' + time(a.resolvedAt)} · ${a.contactsNotified} contact(s) reached ·
          <a href="https://maps.google.com/?q=${a.lat},${a.lng}" target="_blank" rel="noreferrer">location</a></div>`).join('')}</div>` : ''}

      <label>What they wrote</label>
      <div class="thread"><div class="msg raiser"><div class="who">${esc(t.raisedByName || 'Raiser')}<span class="subtle">${time(t.createdAt)}</span></div><div class="body">${esc(t.description)}</div></div>
        ${d.messages.map(ticketMessage).join('')}
      </div>

      <label for="replyBox">${closed ? 'Internal note (the ticket is closed, so replies are off)' : 'Reply'}</label>
      <textarea id="replyBox" maxlength="2000" placeholder="${closed ? 'A note for other operators' : `Write to the ${raiserWord}`}">${keep.draft ? esc(keep.draft) : ''}</textarea>
      <label class="toggle"><input type="checkbox" id="internalToggle" ${closed || keep.internal ? 'checked' : ''} ${closed ? 'disabled' : ''}>
        Internal note — only operators can see it, and nobody is notified</label>
      <div class="reply-row">
        <span class="hint" id="replyHint"></span>
        <button class="btn btn-primary" id="sendReply" type="button">Send</button>
      </div>

      <div class="controls-grid">
        <div class="check">
          <div class="top"><h4>Status</h4>${badge(t.status)}</div>
          ${closed ? '<p>Closed is final. Nothing more can change on this ticket.</p>' : `
          <select id="statusSelect">${TICKET_NEXT[t.status].map(s => `<option value="${s}">${esc(STATUS_TEXT[s])}</option>`).join('')}</select>
          <div class="row"><button class="btn" id="changeStatus" type="button">Change status</button></div>`}
        </div>
        <div class="check">
          <div class="top"><h4>Assignment</h4></div>
          <select id="assignSelect" ${closed ? 'disabled' : ''}>
            <option value="">Unassigned</option>
            ${ops.map(o => `<option value="${esc(o.accountId)}" ${o.accountId === t.assignedAdminId ? 'selected' : ''}>${esc(o.phoneNumber)}</option>`).join('')}
          </select>
          <div class="row"><button class="btn" id="changeAssign" type="button" ${closed ? 'disabled' : ''}>Save assignment</button></div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-cancel type="button">Close</button></div>
  `, { wide: true });

  const root = $('modalRoot');
  root.querySelector('[data-cancel]').addEventListener('click', closeModal);
  const box = root.querySelector('#replyBox');
  const toggle = root.querySelector('#internalToggle');
  const sendBtn = root.querySelector('#sendReply');
  const paintReplyMode = () => {
    const internal = toggle.checked;
    sendBtn.textContent = internal ? 'Add internal note' : 'Send reply';
    root.querySelector('#replyHint').textContent = internal
      ? 'Visible to operators only.'
      : `The ${raiserWord} sees this in the app and is sent a text saying support replied.`;
  };
  paintReplyMode();
  toggle.addEventListener('change', paintReplyMode);
  const current = () => ({ draft: box.value, internal: toggle.checked });

  sendBtn.addEventListener('click', async () => {
    const message = box.value.trim();
    if (!message) { box.focus(); return; }
    sendBtn.disabled = true;
    try {
      await api(`/admin/support/tickets/${id}/messages`, { method: 'POST', body: JSON.stringify({ message, internalOnly: toggle.checked }) });
      toast('ok', toggle.checked ? 'Internal note added' : 'Reply sent', toggle.checked ? 'Only operators can see it.' : `${who} can read it in the app.`);
      openTicket(id);
      render();
    } catch (err) {
      sendBtn.disabled = false;
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not send that', err.message);
    }
  });

  const statusBtn = root.querySelector('#changeStatus');
  if (statusBtn) statusBtn.addEventListener('click', async () => {
    const next = root.querySelector('#statusSelect').value;
    const keepNow = current();
    const copy = {
      RESOLVED: { title: 'Mark this ticket resolved?', message: `${who} will see it as Resolved. If they reply, it reopens automatically.`, label: 'Mark resolved', tone: 'approve' },
      CLOSED: { title: 'Close this ticket?', message: `Closing is final. ${who} will no longer be able to reply to it and would have to raise a new ticket.`, label: 'Close ticket', tone: 'reject' },
      IN_PROGRESS: { title: 'Move this ticket to In progress?', message: `${who} will see that it is being looked at.`, label: 'Move to In progress', tone: 'primary' },
      OPEN: { title: 'Move this ticket back to Open?', message: 'It will read as waiting for someone to pick it up.', label: 'Move to Open', tone: 'primary' },
    }[next];
    const ok = await confirmAction({ title: copy.title, message: copy.message, confirmLabel: copy.label, tone: copy.tone });
    if (!ok) { openTicket(id, keepNow); return; }
    try {
      await api(`/admin/support/tickets/${id}/status`, { method: 'POST', body: JSON.stringify({ status: next }) });
      toast('ok', 'Status changed', `${t.subject} — ${STATUS_TEXT[next]}.`);
      render();
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not change the status', err.message);
    }
    openTicket(id, keepNow);
  });

  root.querySelector('#changeAssign').addEventListener('click', async () => {
    const select = root.querySelector('#assignSelect');
    const assignee = select.value || null;
    if ((assignee || null) === (t.assignedAdminId || null)) { toast('bad', 'Nothing to change', 'That is already who it is assigned to.'); return; }
    const keepNow = current();
    const label = assignee ? select.options[select.selectedIndex].text : null;
    const ok = await confirmAction({
      title: assignee ? 'Assign this ticket?' : 'Unassign this ticket?',
      message: assignee ? `${label} will be recorded as handling "${t.subject}".` : `Nobody will be recorded as handling "${t.subject}".`,
      confirmLabel: assignee ? 'Assign' : 'Unassign',
    });
    if (!ok) { openTicket(id, keepNow); return; }
    try {
      await api(`/admin/support/tickets/${id}/assign`, { method: 'POST', body: JSON.stringify({ assigneeAdminId: assignee }) });
      toast('ok', assignee ? 'Ticket assigned' : 'Ticket unassigned', assignee ? `Assigned to ${label}.` : '');
      render();
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not change the assignment', err.message);
    }
    openTicket(id, keepNow);
  });
}

// ---- content --------------------------------------------------------------
/** The first segment of a key is its area. Order here is the order on screen. */
const CONTENT_AREAS = { home: 'Home', help: 'Help & Support', faq: 'FAQ', about: 'About' };

/**
 * Reading order, not alphabetical. Sorted by key, "subtitle" came before
 * "title" and every FAQ answer before its question, so an editor met the
 * second half of each pair first. Numbers compare as numbers (item 10 after 9).
 */
const CONTENT_PART_ORDER = { title: 0, question: 0, body: 1, subtitle: 1, answer: 1 };
function compareContentKeys(a, b) {
  const pa = a.split('.'), pb = b.split('.');
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i], y = pb[i];
    if (x === y) continue;
    if (x === undefined) return -1;
    if (y === undefined) return 1;
    if (i === pa.length - 1 && i === pb.length - 1 && x in CONTENT_PART_ORDER && y in CONTENT_PART_ORDER) {
      return CONTENT_PART_ORDER[x] - CONTENT_PART_ORDER[y];
    }
    if (/^\d+$/.test(x) && /^\d+$/.test(y)) return Number(x) - Number(y);
    return x < y ? -1 : 1;
  }
  return 0;
}

function paintContent(blocks) {
  const area = stateFor('content').area || '';
  const shown = blocks.filter(b => !area || b.key.startsWith(area + '.')).sort((a, b) => compareContentKeys(a.key, b.key));
  const groups = Object.entries(CONTENT_AREAS)
    .map(([prefix, label]) => ({ label, items: shown.filter(b => b.key.startsWith(prefix + '.')) }))
    .filter(g => g.items.length);
  $('rows').innerHTML = `<tr><td class="content-cell">
    <div class="content-wrap">${groups.map(g => `
      <div class="content-group"><h3>${esc(g.label)}</h3>
        ${g.items.map(b => `
          <div class="cb" data-key="${esc(b.key)}" data-version="${b.version}">
            <div class="where">${esc(b.description)}</div>
            <div class="key">${esc(b.key)}</div>
            <textarea maxlength="2000" rows="${Math.min(6, Math.max(1, Math.ceil(b.value.length / 90)))}">${esc(b.value)}</textarea>
            <div class="foot">
              <button class="btn btn-primary" data-save type="button" disabled>Save</button>
              <button class="btn" data-revert type="button" hidden>Undo changes</button>
              <span class="meta">${b.updatedByPhone ? `Last edited ${time(b.updatedAt)} by <span class="num">${esc(b.updatedByPhone)}</span>` : 'Original text'}</span>
              <span class="chars">${b.value.length}/2000</span>
            </div>
          </div>`).join('')}
      </div>`).join('')}
    </div></td></tr>`;
  $('rows').querySelectorAll('.cb').forEach(el => bindContentBlock(el, blocks.find(b => b.key === el.dataset.key)));
}

function bindContentBlock(el, block) {
  const box = el.querySelector('textarea');
  const save = el.querySelector('[data-save]');
  const revert = el.querySelector('[data-revert]');
  let saved = block.value;
  const sync = () => {
    const dirty = box.value !== saved;
    el.classList.toggle('dirty', dirty);
    save.disabled = !dirty || !box.value.trim();
    revert.hidden = !dirty;
    el.querySelector('.chars').textContent = `${box.value.length}/2000`;
  };
  box.addEventListener('input', sync);
  revert.addEventListener('click', () => { box.value = saved; sync(); });
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const row = await api(`/admin/content/${encodeURIComponent(block.key)}`, {
        method: 'PUT',
        body: JSON.stringify({ value: box.value, version: Number(el.dataset.version) }),
      });
      saved = row.value;
      box.value = row.value;
      el.dataset.version = row.version;
      el.querySelector('.meta').innerHTML = `Last edited ${time(row.updatedAt)} by <span class="num">${esc(row.updatedByPhone)}</span>`;
      sync();
      toast('ok', 'Saved', `${block.description} — live in the apps within about five minutes.`);
    } catch (err) {
      sync();
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not save that', err.message);
    }
  });
}

// ---- rendering ------------------------------------------------------------
function skeletonRows(cols) {
  return Array.from({ length: 4 }, () =>
    `<tr>${Array.from({ length: cols }, () => '<td><div class="skel"></div></td>').join('')}</tr>`
  ).join('');
}

function paintRows(view, data, emptyState) {
  const cols = view.columns;
  const state = emptyState || view.empty;
  if (!data.length) {
    $('rows').innerHTML = `<tr><td colspan="${cols.length}">
      <div class="state">${state.icon}<h3>${esc(state.title)}</h3><p>${esc(state.text)}</p></div>
    </td></tr>`;
    return;
  }
  const sorted = data.slice();
  if (sort.key) {
    const col = cols.find(c => c.key === sort.key);
    if (col && col.sort) {
      sorted.sort((a, b) => {
        const va = col.sort(a), vb = col.sort(b);
        const cmp = va < vb ? -1 : va > vb ? 1 : 0;
        return sort.dir === 'asc' ? cmp : -cmp;
      });
    }
  }
  $('rows').innerHTML = sorted.map((r, i) =>
    `<tr class="${view.onRowClick ? 'clickable' : ''}" data-i="${i}">` +
    cols.map(c => `<td>${view.cell(r, c.key)}</td>`).join('') + '</tr>'
  ).join('');
  lastRows = sorted;
}

function paintHead(view) {
  $('head').innerHTML = '<tr>' + view.columns.map(c => {
    // Not sortable still gets its name. Only a column with no label - the
    // action column - is genuinely nameless. This used to drop the label
    // along with the arrow, so an unsortable data column arrived with a
    // blank heading and the operator had to guess what was under it.
    // esc() renders an em dash for an empty value, which is right in a data
    // cell and wrong in a heading - so an empty label stays genuinely empty.
    if (!c.sort) return `<th>${c.label ? esc(c.label) : ''}</th>`;
    const active = sort.key === c.key;
    const arrow = active ? (sort.dir === 'asc' ? '▲' : '▼') : '↕';
    return `<th class="sortable" data-sort="${c.key}" ${active ? `aria-sort="${sort.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}>
      ${esc(c.label)} <span class="arrow">${arrow}</span></th>`;
  }).join('') + '</tr>';

  $('head').querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => {
    const key = th.dataset.sort;
    sort = sort.key === key ? { key, dir: sort.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
    paintHead(view);
    paintRows(view, lastRows);
  }));
}

async function render(opts = {}) {
  const view = VIEWS[tab];
  $('pageTitle').textContent = view.title;
  $('pageDesc').textContent = view.desc;
  $('cardTitle').textContent = view.cardTitle;
  $('cardHint').textContent = view.hint;
  $('err').hidden = true;
  paintHead(view);
  paintFilters(view);
  // Typing into the search box re-renders the bar, which would otherwise
  // take the cursor with it mid-word.
  if (opts.keepFocus) {
    const el = $('filters').querySelector(`[data-filter="${opts.keepFocus}"]`);
    if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); }
  }
  $('crossLink').hidden = true;
  refreshSupportCounts().then(paintCrossLink);
  if (view.custom) {
    $('head').innerHTML = '';
    paintPager(null);
    $('rows').innerHTML = skeletonRows(1);
    try {
      const blocks = await view.load(stateFor(tab));
      paintContent(blocks);
      $('cContent').textContent = blocks.length;
    } catch (err) {
      if (err.message === 'unauthorized') return;
      $('rows').innerHTML = `<tr><td><div class="state"><h3>Could not load this section</h3><p>${esc(err.message)}</p></div></td></tr>`;
    }
    return;
  }
  $('rows').innerHTML = skeletonRows(view.columns.length);
  try {
    const state = stateFor(tab);
    const result = await view.load(state);
    // A paged endpoint answers with items and totals; the unpaged ones
    // still answer with a bare array. Normalise so the rest does not care.
    const paged = Array.isArray(result)
      ? null
      : { ...result, pageSize: result.pageSize || PAGE_SIZE };
    const rows = paged ? paged.items : result;

    // Which empty state: "nothing here yet" and "nothing matches" mean
    // completely different things, and showing the first to someone whose
    // filters are simply too narrow reads as lost data.
    const narrowed = activeFilterCount(view, state) > 0;
    paintRows(view, rows, narrowed && view.emptyFiltered ? view.emptyFiltered : view.empty);
    paintPager(paged);

    const counts = { queue: 'cQueue', sos: 'cSos', bookings: 'cBookings', accounts: 'cAccounts', trust: 'cTrust' };
    // The badge counts everything matching, not the rows on this page -
    // "25" beside Bookings when there are 400 would be a lie. Support is
    // not in this map: its badge counts unresolved tickets whatever the
    // filters say, and is refreshed on every render - see refreshSupportCounts.
    if (counts[tab]) $(counts[tab]).textContent = paged ? paged.totalItems : rows.length;
  } catch (err) {
    if (err.message === 'unauthorized') return;
    paintPager(null);
    $('rows').innerHTML = `<tr><td colspan="${view.columns.length}">
      <div class="state"><h3>Could not load this section</h3><p>${esc(err.message)}</p></div></td></tr>`;
    $('err').textContent = err.message;
    $('err').hidden = false;
  }
}

/** Changes section; `state`, when given, replaces that section's filters (e.g. arriving from a cross-link). */
function switchTab(name, state) {
  tab = name;
  sort = { key: null, dir: 'asc' };
  if (state) filterState[name] = state;
  $('nav').querySelectorAll('button[data-tab]').forEach(x =>
    x.setAttribute('aria-current', x.dataset.tab === name ? 'page' : 'false'));
  render();
}
$('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  switchTab(b.dataset.tab);
});
$('refresh').addEventListener('click', render);

// Delegated so freshly rendered rows need no re-binding.
$('rows').addEventListener('click', async e => {
  const resolveBtn = e.target.closest('[data-resolve]');
  if (resolveBtn) {
    const ok = await confirmAction({
      title: 'Mark this SOS alert as resolved?',
      message: 'Only do this once the situation has actually been dealt with. The alert will leave the active list.',
      confirmLabel: 'Mark resolved',
    });
    if (!ok) return;
    try {
      await api(`/admin/sos/${resolveBtn.dataset.resolve}/resolve`, { method: 'POST' });
      toast('ok', 'Alert resolved', 'It has been removed from the active list.');
      render();
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not resolve that alert', err.message);
    }
    return;
  }
  const blockBtn = e.target.closest('[data-block]');
  if (blockBtn) {
    const row = lastRows[Number(blockBtn.closest('tr[data-i]').dataset.i)];
    const who = row.name || row.phoneNumber || row.email;
    const ok = await confirmAction({
      title: 'Block this account?',
      message: row.role === 'DRIVER'
        ? `${who} will not be able to sign in, and will stop receiving trips immediately even if they are online right now.`
        : `${who} will not be able to sign in or book. Any trip already in progress is not cancelled by this.`,
      confirmLabel: 'Block account',
      tone: 'reject',
      // Required, not optional, and the console enforces it before the
      // request is sent - see requireReason. An audit row that says nothing
      // is worse than none, because it looks answered.
      withReason: true,
      reasonRequired: true,
      reasonLabel: 'Why are you blocking this account? (required, kept for audit)',
      reasonPlaceholder: 'e.g. Repeated no-shows reported by three riders on 11 Sep',
    });
    if (!ok) return;
    try {
      await api(`/admin/accounts/${row.accountId}/block`, {
        method: 'POST',
        body: JSON.stringify({ reason: ok.reason }),
      });
      toast('ok', 'Account blocked', `${who} can no longer sign in.`);
      render();
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not block that account', err.message);
    }
    return;
  }

  const clearFlagBtn = e.target.closest('[data-clearflag]');
  if (clearFlagBtn) {
    const row = lastRows[Number(clearFlagBtn.closest('tr[data-i]').dataset.i)];
    const who = row.name || row.phoneNumber || row.email;
    const ok = await confirmAction({
      title: 'Clear this review flag?',
      // Says plainly what clearing does and does not do. An operator who
      // believes this wipes the record will use it as a favour, and that is
      // not what it is.
      message: `${who} comes off this list. Nothing is reset — the cancellation figures and the rating average stay exactly as they are, and if either crosses the line again they will be flagged again.`,
      confirmLabel: 'Clear flag',
    });
    if (!ok) return;
    try {
      await api(`/admin/accounts/${row.accountId}/clear-review-flag`, { method: 'POST' });
      toast('ok', 'Flag cleared', `${who} is off the review list.`);
      render();
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not clear that flag', err.message);
    }
    return;
  }

  const unblockBtn = e.target.closest('[data-unblock]');
  if (unblockBtn) {
    const row = lastRows[Number(unblockBtn.closest('tr[data-i]').dataset.i)];
    const who = row.name || row.phoneNumber || row.email;
    const ok = await confirmAction({
      title: 'Restore access for this account?',
      message: `${who} will be able to sign in again${row.role === 'DRIVER' ? ' and can go back online' : ''}. The reason recorded for the block is cleared.`,
      confirmLabel: 'Unblock account',
    });
    if (!ok) return;
    try {
      await api(`/admin/accounts/${row.accountId}/unblock`, { method: 'POST' });
      toast('ok', 'Account unblocked', `${who} can sign in again.`);
      render();
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast('bad', 'Could not unblock that account', err.message);
    }
    return;
  }

  const view = VIEWS[tab];
  if (!view.onRowClick) return;
  const tr = e.target.closest('tr[data-i]');
  if (!tr) return;
  view.onRowClick(lastRows[Number(tr.dataset.i)]);
});

function start() {
  $('loginWrap').hidden = true;
  $('app').hidden = false;
  $('who').textContent = localStorage.getItem('sheout.admin.phone') || '—';
  render();
}

if (token) start();
</script>
</body>
</html>
