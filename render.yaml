# Render Blueprint - defines how the SheOut backend deploys to Render.
# https://render.com/docs/blueprint-spec
#
# Postgres and Redis are Render's own free-tier resources here (a deliberate
# choice, not the earlier plan): Render's free Postgres expires after 30
# days and its free Key Value (Redis) caps at 25MB, but for now ("30 days
# is fine, I'll move to a paid plan once the app is finished") that's an
# acceptable trade-off in exchange for zero external accounts to set up.
# When the paid plan happens, bump both `plan:` fields below to something
# non-expiring - no other change needed, since the web service reads
# DATABASE_URL/REDIS_URL from these resources either way.
databases:
  - name: sheout-db
    databaseName: sheout
    user: sheout
    plan: free
    region: singapore

services:
  - type: keyvalue
    name: sheout-redis
    plan: free
    region: singapore
    # No external access needed - only sheout-backend (same Render account/
    # private network) ever talks to this. Empty list = internal-only.
    ipAllowList: []

  - type: web
    name: sheout-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # bump to `starter` before any real user/driver testing - see README
    region: singapore # closest Render region to Hyderabad
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render

      # Browser-based calls from the two Vercel PWAs - without this, WebConfig
      # falls back to its localhost-only default and every fetch() from the
      # live frontends gets rejected by the browser's CORS check (curl-based
      # health checks never catch this - CORS is browser-enforced only).
      - key: CORS_ALLOWED_ORIGINS
        # sheoutride.com is where the apps live; the vercel.app addresses
        # stay for phones that installed the app from them.
        value: https://app.sheoutride.com,https://partner.sheoutride.com,https://sheout-customer-app.vercel.app,https://sheout-driver-app.vercel.app

      # The real client address for per-client rate limits. Requests reach
      # the app from Render's proxy, so the socket address is shared by every
      # user; Cloudflare, in front of Render, overwrites this header with the
      # address it accepted the connection from. See ClientAddressResolver.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP

      # Render hands these back as postgres://user:pass@host:port/db and
      # redis://[user:pass@]host:port respectively. The Postgres one gets
      # automatically reshaped into the jdbc:postgresql://...?user=...
      # form Spring's driver actually needs - see
      # PostgresUrlEnvironmentPostProcessor - so no manual editing needed
      # here, unlike when this pointed at an external provider.
      - key: DATABASE_URL
        fromDatabase:
          name: sheout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sheout-redis
          property: connectionString

      # Still a secret you set yourself - Render doesn't generate this for you.
      - key: JWT_SECRET
        sync: false

      # THE MASTER SWITCH for every dev/test bypass below (fixed-code
      # sign-in numbers and prefix, codes in the log, the verification
      # bypasses). Unset or false: all of them are off, whatever else is
      # set - see DevMode. While there is no SMS provider, test sign-in
      # (operators included) needs this "true". At launch: an SMS provider
      # live first, then set this false - and nothing else needs clearing.
      - key: DEV_MODE_ENABLED
        sync: false
      # Every number starting with this (e.g. +91999999) signs in with
      # DEV_OTP_TEST_CODE (default 123456) - for QA and load tests. Must be
      # + and at least 8 digits.
      - key: DEV_OTP_TEST_PREFIX
        sync: false
      - key: DEV_OTP_TEST_CODE
        sync: false

      # No real SMS provider is wired up yet (see ConsoleOtpSender) - OTPs
      # only ever reach Render's logs, never a phone. These two make demoing
      # login possible without watching logs: requesting an OTP for exactly
      # this phone number always issues this fixed code instead of a random
      # one. Not a secret in the usual sense (it's meant to be handed to
      # demo viewers), but kept out of render.yaml so it's not sitting in
      # git history - set both in the dashboard. Remove once a real SMS
      # provider exists.
      - key: DEV_OTP_PHONE
        sync: false
      - key: DEV_OTP_CODE
        sync: false
      # Second slot for a DRIVER demo login - accounts are one-role-per-phone,
      # so DEV_OTP_PHONE above (already a CUSTOMER account) can't double as
      # a driver login too.
      - key: DEV_OTP_PHONE_2
        sync: false
      - key: DEV_OTP_CODE_2
        sync: false
      # Third slot, dedicated to automated QA new-account testing - slots 1
      # and 2 are now permanently consumed real accounts, so neither can
      # exercise the new-signup path anymore. Set to any never-used number
      # when a QA pass needs one.
      - key: DEV_OTP_PHONE_3
        sync: false
      - key: DEV_OTP_CODE_3
        sync: false

      # TESTING AID ONLY, NOT A PRODUCT FEATURE - see BookingService's
      # Javadoc on isVerifiedBypassAccount. Blank/unset here by default;
      # only ever set this on a throwaway QA/staging account, never in a
      # real production deploy - it lets that one phone number's account
      # skip the real gender-verification check on booking creation.
      - key: VERIFIED_BYPASS_PHONE
        sync: false
      # Same idea, driver side - see DriverProfileService's Javadoc on
      # isVerifiedBypassAccount. Lets one configured driver phone number
      # go ONLINE without real admin verification (no self-service path
      # to VERIFIED status exists at all).
      - key: VERIFIED_DRIVER_BYPASS_PHONE
        sync: false

      # The operator account for the admin console. Signup refuses
      # role=ADMIN, so this is the only way an ADMIN account can exist.
      # The account must already exist (sign in with this number once
      # first); AdminBootstrap promotes it on the next boot. A promoted
      # account must sign in AGAIN to get a token carrying the new role.
      - key: ADMIN_BOOTSTRAP_PHONE
        sync: false

      # The number a rider or partner is offered instead of each other's.
      #
      # Direct customer-to-driver calling does not exist in this product and
      # is not coming: handing a stranger a woman's real number cannot be
      # undone, and it outlives the trip it was given for. Everything
      # routine goes through booking-scoped chat; this number is where a
      # real person picks up for everything else.
      #
      # Must be set for production. Both apps hide their Contact Support
      # action while it is blank, which leaves a live service with no way to
      # reach a human.
      - key: SUPPORT_PHONE_NUMBER
        sync: false

      # The DPDP Grievance Officer's email: where data-rights requests and
      # grievances go, shown in both apps and named in the privacy policy.
      # Must be set for production.
      - key: GRIEVANCE_OFFICER_EMAIL
        sync: false

      # --- Fare engine ---
      #
      # Pricing is entirely configuration: there is not a rupee value in the
      # fare code, so a rate can change without a redeploy. That matters -
      # "we cannot change the price until the next release" is not an answer
      # to a partner who says a rate does not cover her fuel.
      #
      # These are a STARTING HYPOTHESIS shaped from Rapido's published
      # Hyderabad structure, NOT a final price. Nothing here has been checked
      # against real costs, and the first driver feedback should move it.
      #
      # fare = base + (perKm x km) + (perMinute x min), x surge, x night if
      # inside the window, then floored at the minimum.
      - key: BIKE_BASE_FARE
        value: "22.00"
      - key: BIKE_PER_KM_RATE
        value: "9.00"
      - key: BIKE_PER_MINUTE_RATE
        value: "1.20"
      - key: BIKE_MINIMUM_FARE
        value: "37.00"
      - key: BIKE_NIGHT_MULTIPLIER
        value: "1.30"
      - key: BIKE_NIGHT_WINDOW_START
        value: "22:00"
      - key: BIKE_NIGHT_WINDOW_END
        value: "06:00"
      # The slot real demand-based surge will fill. 1.00 means no surge.
      - key: BIKE_SURGE_MULTIPLIER
        value: "1.00"

      # A parcel carries no passenger, so time in traffic costs a partner
      # less than carrying somebody through it.
      - key: PARCEL_BASE_FARE
        value: "25.00"
      - key: PARCEL_PER_KM_RATE
        value: "10.00"
      - key: PARCEL_PER_MINUTE_RATE
        value: "1.00"
      - key: PARCEL_MINIMUM_FARE
        value: "40.00"
      - key: PARCEL_NIGHT_MULTIPLIER
        value: "1.30"
      - key: PARCEL_NIGHT_WINDOW_START
        value: "22:00"
      - key: PARCEL_NIGHT_WINDOW_END
        value: "06:00"
      - key: PARCEL_SURGE_MULTIPLIER
        value: "1.00"

      # Night windows are wall-clock and this service runs in UTC. Without
      # this, a 22:00-06:00 window would apply the surcharge from 03:30 to
      # 11:30 local - over breakfast, and not at midnight.
      - key: FARE_TIMEZONE
        value: Asia/Kolkata

      # Real road distance and duration, from OSRM. THE PUBLIC DEMO SERVER
      # IS A DEBT: documented rate limits, no uptime guarantee, no support,
      # and a usage policy that does not contemplate a commercial service
      # pricing its trips on it. Self-host (it ships a Docker image) once
      # real traffic justifies the instance, then point this at it.
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: ROUTING_TIMEOUT_MS
        value: "4000"
      # Used only when routing is unavailable, so a rider can still book
      # rather than being refused. Erring high is deliberate: the error then
      # costs the rider a little, not the partner.
      - key: ROAD_DISTANCE_FACTOR
        value: "1.4"
      - key: FALLBACK_SPEED_KMPH
        value: "22"

      # What the platform keeps of each captured fare. The rider pays the
      # full fare she was quoted; this comes out of it and is recorded, so
      # the margin is never silently folded into a higher price and a
      # partner can be shown her own breakdown.
      - key: PLATFORM_COMMISSION_PERCENT
        value: "18.00"

      # Total time dispatch may spend hunting for a driver for one booking,
      # across every retry round and radius expansion. NOT the per-offer
      # accept window - that bounds one driver answering one offer. They
      # solve different problems and must never be merged.
      #
      # Whichever runs out first, this or DISPATCH_MAX_RETRIES, ends the
      # search and the booking becomes NO_DRIVERS_AVAILABLE instead of
      # sitting in REQUESTED with a spinner that never stops.
      - key: SEARCH_TIMEOUT_SECONDS
        value: "90"

      # When a cancellation rate is worth a person's attention, as a
      # fraction: 0.4 means "cancels more than 40% of her trips".
      #
      # Crossing it puts the account on the console's Trust Review list and
      # does nothing else - no block, no throttle, no fee. That is
      # deliberate and should stay that way: a high rate can mean somebody
      # avoiding fares or somebody repeatedly abandoned by partners who
      # never turned up, and only a person reading the reasons can tell.
      - key: CANCELLATION_RATE_WARNING_THRESHOLD
        value: "0.4"

      # No flag until an account has this many bookings behind it. Without
      # it, one cancellation on a first-ever booking is a rate of 100% and
      # every new user who changed her mind once starts her second trip with
      # an open case against her.
      - key: CANCELLATION_MINIMUM_BOOKINGS
        value: "5"

      # The other half of the same flag. An average below this, once enough
      # people have rated, puts the account on the same Trust Review queue -
      # one queue, because an account failing both checks is one case.
      - key: RATING_REVIEW_THRESHOLD
        value: "3.5"
      # One furious rider on a partner's first night out is an anecdote, not
      # a pattern. No rating flag until at least this many people have rated.
      - key: RATING_MINIMUM_COUNT
        value: "5"

      # How long after a trip it can still be rated. A rating is a memory,
      # and days later what is left is rarely the ride. It also stops an old
      # trip staying a live threat either party can hold over the other.
      - key: RATING_WINDOW_HOURS
        value: "72"

      # Google Sign-In - see GoogleTokenVerifier. Not set yet: no real
      # Google Cloud OAuth Client ID exists for this build. Until it's set,
      # the /api/v1/auth/google/verify endpoint returns 503 rather than
      # crashing the app at startup.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

      # Crash reporting. Blank means the SDK never starts and nothing is
      # sent - see platform.SentryConfig for what is stripped from an event
      # before it leaves. The two frontends have their own DSN, set in
      # Vercel as VITE_SENTRY_DSN (a build-time variable, so changing it
      # needs a redeploy).
      - key: SENTRY_DSN
        sync: false

      # Not implemented yet - leave blank until they are.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Signs Razorpay's webhook calls. Without it every webhook is refused,
      # and a payment the app never heard back about stays unpaid.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # Uploaded photos and documents: not declared here, so they default to
      # DatabaseDocumentStorage - stored in the Postgres above and served
      # through signed links built from RENDER_EXTERNAL_URL, which Render
      # sets itself. Never DOCUMENT_STORAGE_PROVIDER=local on Render: the
      # container disk is wiped on every restart and redeploy. For a bucket
      # instead, set DOCUMENT_STORAGE_PROVIDER=s3 plus
      # DOCUMENT_STORAGE_S3_BUCKET, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.

      # Not declared: PORT. Render injects it automatically (defaults to
      # 10000) for every web service, Docker-based ones included - the app
      # already binds to it via server.port=${PORT:8080} in application.yml.
