# Render Blueprint - defines how the SheOut backend deploys to Render.
# https://render.com/docs/blueprint-spec
#
# Postgres and Redis are Render's own free-tier resources here (a deliberate
# choice, not the earlier plan): Render's free Postgres expires after 30
# days and its free Key Value (Redis) caps at 25MB, but for now ("30 days
# is fine, I'll move to a paid plan once the app is finished") that's an
# acceptable trade-off in exchange for zero external accounts to set up.
# When the paid plan happens, bump both `plan:` fields below to something
# non-expiring - no other change needed, since the web service reads
# DATABASE_URL/REDIS_URL from these resources either way.
databases:
  - name: sheout-db
    databaseName: sheout
    user: sheout
    plan: free
    region: singapore

services:
  - type: keyvalue
    name: sheout-redis
    plan: free
    region: singapore
    # No external access needed - only sheout-backend (same Render account/
    # private network) ever talks to this. Empty list = internal-only.
    ipAllowList: []

  - type: web
    name: sheout-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # bump to `starter` before any real user/driver testing - see README
    region: singapore # closest Render region to Hyderabad
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render

      # Browser-based calls from the two Vercel PWAs - without this, WebConfig
      # falls back to its localhost-only default and every fetch() from the
      # live frontends gets rejected by the browser's CORS check (curl-based
      # health checks never catch this - CORS is browser-enforced only).
      - key: CORS_ALLOWED_ORIGINS
        value: https://sheout-customer-app.vercel.app,https://sheout-driver-app.vercel.app

      # Render hands these back as postgres://user:pass@host:port/db and
      # redis://[user:pass@]host:port respectively. The Postgres one gets
      # automatically reshaped into the jdbc:postgresql://...?user=...
      # form Spring's driver actually needs - see
      # PostgresUrlEnvironmentPostProcessor - so no manual editing needed
      # here, unlike when this pointed at an external provider.
      - key: DATABASE_URL
        fromDatabase:
          name: sheout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sheout-redis
          property: connectionString

      # Still a secret you set yourself - Render doesn't generate this for you.
      - key: JWT_SECRET
        sync: false

      # No real SMS provider is wired up yet (see ConsoleOtpSender) - OTPs
      # only ever reach Render's logs, never a phone. These two make demoing
      # login possible without watching logs: requesting an OTP for exactly
      # this phone number always issues this fixed code instead of a random
      # one. Not a secret in the usual sense (it's meant to be handed to
      # demo viewers), but kept out of render.yaml so it's not sitting in
      # git history - set both in the dashboard. Remove once a real SMS
      # provider exists.
      - key: DEV_OTP_PHONE
        sync: false
      - key: DEV_OTP_CODE
        sync: false
      # Second slot for a DRIVER demo login - accounts are one-role-per-phone,
      # so DEV_OTP_PHONE above (already a CUSTOMER account) can't double as
      # a driver login too.
      - key: DEV_OTP_PHONE_2
        sync: false
      - key: DEV_OTP_CODE_2
        sync: false
      # Third slot, dedicated to automated QA new-account testing - slots 1
      # and 2 are now permanently consumed real accounts, so neither can
      # exercise the new-signup path anymore. Set to any never-used number
      # when a QA pass needs one.
      - key: DEV_OTP_PHONE_3
        sync: false
      - key: DEV_OTP_CODE_3
        sync: false

      # TESTING AID ONLY, NOT A PRODUCT FEATURE - see BookingService's
      # Javadoc on isVerifiedBypassAccount. Blank/unset here by default;
      # only ever set this on a throwaway QA/staging account, never in a
      # real production deploy - it lets that one phone number's account
      # skip the real gender-verification check on booking creation.
      - key: VERIFIED_BYPASS_PHONE
        sync: false
      # Same idea, driver side - see DriverProfileService's Javadoc on
      # isVerifiedBypassAccount. Lets one configured driver phone number
      # go ONLINE without real admin verification (no self-service path
      # to VERIFIED status exists at all).
      - key: VERIFIED_DRIVER_BYPASS_PHONE
        sync: false

      # Google Sign-In - see GoogleTokenVerifier. Not set yet: no real
      # Google Cloud OAuth Client ID exists for this build. Until it's set,
      # the /api/v1/auth/google/verify endpoint returns 503 rather than
      # crashing the app at startup.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

      # Not implemented yet - leave blank until they are.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # driver-verification document storage: not declared here, so it
      # defaults to LocalDiskDocumentStorage - which writes to Render's
      # container filesystem, wiped on every restart/redeploy. Fine while
      # no real documents are being collected yet; before that changes,
      # set DOCUMENT_STORAGE_PROVIDER=s3 plus DOCUMENT_STORAGE_S3_BUCKET,
      # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the dashboard (see
      # README) so uploads persist.

      # Not declared: PORT. Render injects it automatically (defaults to
      # 10000) for every web service, Docker-based ones included - the app
      # already binds to it via server.port=${PORT:8080} in application.yml.
