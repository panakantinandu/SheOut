  </defs>
  <rect width="480" height="480" rx="104" fill="url(#mk-bg)"/>
  <!-- shop -->
  <rect x="96" y="160" width="288" height="230" rx="18" fill="#FFFFFF"/>
  <rect x="122" y="214" width="110" height="96" rx="10" fill="#FDE7F0"/>
  <rect x="252" y="214" width="106" height="176" rx="10" fill="#EDE5FA"/>
