# Runs on every push to main and every pull request: the backend's tests
# against a real Postgres and Redis (the same versions of each the app
# uses), and a production build of both apps. It deploys nothing - Render and
# Vercel deploy as before - it only says, before a deploy, whether main is
# sound.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sheout
          POSTGRES_USER: sheout
          POSTGRES_PASSWORD: sheout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sheout" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B -ntp test
        env:
          SPRING_PROFILES_ACTIVE: local
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Legal pages agree with the server
        run: node scripts/check-legal-sync.mjs
      - name: Rider app
        run: npm run build --workspace frontend/customer-app
      - name: Partner app
        run: npm run build --workspace frontend/driver-app
      - name: Public site
        run: npm run build --workspace frontend/marketing-site
      - name: No removed claims or placeholder content in what ships
        run: node scripts/check-legal-sync.mjs --bundles frontend/customer-app/dist frontend/driver-app/dist frontend/marketing-site/dist

  # axe-core on every main screen of both apps (en/hi/te, four widths), the
  # keyboard-only journeys (sign-in, booking, trip, SOS, parcel; partner
  # go-online, offer, trip) with their screen-reader announcements, and the
  # console's court-record check flow, all against mocked APIs. A serious or
  # critical accessibility violation fails the run.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rider app
        run: npm run test:e2e --workspace frontend/customer-app -- --workers=2
      - name: Partner app
        run: npm run test:e2e --workspace frontend/driver-app -- --workers=2
      - name: Console court-record check
        run: npx playwright test -c qa/console-e2e
